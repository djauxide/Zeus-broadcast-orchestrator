<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeus Broadcast Orchestrator — Operator Console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
    <style>
        /* ============================================================================
           ZEUS BROADCAST ORCHESTRATOR — UNIFIED OPERATOR CONSOLE
           ============================================================================ */
        :root {
            --bg-dark: #0a0e14;
            --bg-panel: #131a23;
            --bg-card: #18212d;
            --bg-hover: #1e2a3a;
            --line: #243044;
            --line-bright: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #5cc8ff;
            --accent-hover: #4fd1c5;
            --success: #35d07f;
            --success-dim: rgba(53, 208, 127, 0.15);
            --success-border: rgba(53, 208, 127, 0.35);
            --warn: #f0b429;
            --warn-dim: rgba(240, 180, 41, 0.15);
            --warn-border: rgba(240, 180, 41, 0.35);
            --fail: #ff5c73;
            --fail-dim: rgba(255, 92, 115, 0.15);
            --fail-border: rgba(255, 92, 115, 0.35);
            --info: #38bdf8;
            --router-free: #1e293b;
            --router-active: #35d07f;
            --router-locked: #ff5c73;
            --router-protect: #f0b429;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            --radius: 8px;
            --radius-lg: 12px;
            --transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Roboto Mono', monospace;
            --rack-unit-h: 36px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-ui);
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }
        button {
            background: var(--bg-panel);
            border: 1px solid var(--line);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }
        button:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
        button:active { transform: scale(0.97); }
        button.primary { background: var(--accent); color: var(--bg-dark); border-color: var(--accent); }
        button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        button.danger { border-color: var(--fail-border); color: var(--fail); }
        button.danger:hover { background: var(--fail-dim); border-color: var(--fail); }

        /* ===== App Shell ===== */
        #app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }

        /* Top Bar */
        header.topbar {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--line);
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            flex-shrink: 0;
            z-index: 100;
        }
        .topbar-left { display: flex; align-items: center; gap: 1rem; }
        .topbar-center { display: flex; align-items: center; gap: 1rem; flex: 1; justify-content: center; }
        .topbar-right { display: flex; align-items: center; gap: 1rem; }

        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), #06b6d4); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .app-name { font-size: 1.1rem; }

        .env-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 4px 10px;
        }
        .env-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .env-select {
            background: transparent;
            border: 1px solid var(--line-bright);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .env-select option { background: var(--bg-panel); color: var(--text-primary); }

        .sys-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .sys-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
        .sys-dot.degraded { background: var(--warn); }
        .sys-dot.down { background: var(--fail); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .timecode {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--line);
            color: var(--accent);
        }

        .user-menu { display: flex; align-items: center; gap: 8px; }

        /* Main Body */
        .main-body { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        aside.sidebar {
            width: 64px;
            background: var(--bg-panel);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 0.5rem;
            flex-shrink: 0;
            z-index: 50;
        }
        .nav-item {
            width: 44px; height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all var(--transition);
            color: var(--text-muted);
            position: relative;
        }
        .nav-item:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
        .nav-item.active { background: var(--accent); color: var(--bg-dark); border-color: var(--accent); box-shadow: 0 0 15px rgba(92, 200, 255, 0.3); }
        .nav-item .label { position: absolute; bottom: -22px; font-size: 0.7rem; white-space: nowrap; opacity: 0; transition: opacity var(--transition); pointer-events: none; }
        .nav-item:hover .label { opacity: 1; }

        /* Workspace */
        .workspace { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }

        .workspace-header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--line);
            height: 48px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; flex-shrink: 0;
        }
        .ws-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .ws-actions { display: flex; gap: 8px; }

        .workspace-content { flex: 1; overflow: auto; padding: 1.5rem; background: var(--bg-dark); }

        /* Tab system for workspace */
        .ws-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
        .ws-tab { padding: 10px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: all var(--transition); }
        .ws-tab:hover { color: var(--text-primary); background: var(--bg-panel); }
        .ws-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg-panel); }

        /* Bottom Status Bar */
        footer.statusbar {
            background: var(--bg-panel);
            border-top: 1px solid var(--line);
            height: 36px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; flex-shrink: 0;
            font-size: 0.8rem; color: var(--text-muted);
        }

        /* ===== Stat Cards ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .stat-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .stat-card .value { font-size: 1.75rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-mono); }
        .stat-card .sub { font-size: 0.8rem; color: var(--text-secondary); }

        /* ===== Tables ===== */
        .table-container { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-card); }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { background: rgba(15, 23, 42, 0.4); color: var(--text-secondary); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 12px; text-align: left; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--text-primary); }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* ===== Badges ===== */
        .badge {
            display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 12px;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.4px;
        }
        .badge.online { background: var(--success-dim); color: var(--success); border: 1px solid var(--success-border); }
        .badge.offline { background: var(--fail-dim); color: var(--fail); border: 1px solid var(--fail-border); }
        .badge.degraded { background: var(--warn-dim); color: var(--warn); border: 1px solid var(--warn-border); }
        .badge.pending { background: rgba(148,163,184,0.15); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.3); }
        .badge.active { background: var(--accent-dim, rgba(92,200,255,0.15)); color: var(--accent); border: 1px solid rgba(92,200,255,0.3); }
        .badge.idle { background: rgba(148,163,184,0.15); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.3); }

        /* ===== Code ===== */
        code { font-family: var(--font-mono); font-size: 0.82rem; background: rgba(15,23,42,0.5); padding: 2px 6px; border-radius: 4px; color: #a5f3fc; }

        /* ===== Empty State ===== */
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 1rem; display: block; }
        .empty-state h3 { color: var(--text-primary); margin-bottom: 0.5rem; }

        /* ===== Router Grid ===== */
        .router-section { display: flex; gap: 1rem; height: calc(100vh - 280px); }
        .router-sidebar { width: 320px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
        .router-main { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .router-controls { padding: 1rem; border-bottom: 1px solid var(--line); background: var(--bg-card); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .router-grid-wrap { flex: 1; overflow: auto; padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 4px; }
        .router-cell {
            aspect-ratio: 1;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--router-free);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700; color: var(--text-muted);
            cursor: pointer; transition: all var(--transition);
            position: relative;
        }
        .router-cell:hover { border-color: var(--accent); transform: translateY(-1px); z-index: 2; box-shadow: var(--shadow); }
        .router-cell.active { background: var(--router-active); color: #000; border-color: var(--success); }
        .router-cell.locked { background: var(--router-locked); color: #fff; border-color: var(--fail); }
        .router-cell.protect { background: var(--router-protect); color: #000; border-color: var(--warn); }
        .router-cell .lbl { position: absolute; top: 2px; left: 4px; font-size: 0.55rem; opacity: 0.7; pointer-events: none; }

        /* ===== Rack System ===== */
        .rack-section { display: flex; gap: 1rem; height: calc(100vh - 280px); }
        .rack-canvas { flex: 1; background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0) 100%); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.5rem; position: relative; overflow: auto; }
        .rack-frame {
            width: 620px; border: 3px solid var(--line-bright); border-radius: 8px;
            background: var(--bg-card); position: relative; padding: 0.5rem; margin: 0 auto;
        }
        .rack-rail { position: absolute; top: 0.5rem; bottom: 0.5rem; width: 18px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .rack-rail.left { left: -28px; }
        .rack-rail.right { right: -28px; }
        .rack-u { width: 100%; height: var(--rack-unit-h); border-top: 1px dashed rgba(255,255,255,0.08); }
        .rack-slot {
            height: var(--rack-unit-h); border: 1px solid var(--line);
            border-radius: 6px; background: var(--bg-dark);
            margin-bottom: 4px; cursor: pointer; position: relative;
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem;
            transition: all var(--transition);
        }
        .rack-slot:hover { border-color: var(--accent); background: var(--bg-hover); }
        .rack-slot.occupied { background: var(--bg-card); border-color: var(--accent); }
        .rack-equip { width: 100%; height: 100%; border-radius: 5px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--line-bright); display: flex; flex-direction: column; padding: 6px; font-size: 0.7rem; color: var(--text-secondary); overflow: hidden; }
        .rack-equip .eq-name { font-weight: 700; color: var(--text-primary); margin-bottom: 4px; font-size: 0.8rem; }
        .rack-equip .eq-status { font-size: 0.65rem; margin-top: auto; }
        .rack-empty { text-align: center; color: var(--text-muted); padding: 2rem; font-size: 0.9rem; }

        /* ===== Patch Bay ===== */
        .patch-section { display: flex; gap: 1rem; height: calc(100vh - 280px); }
        .patch-panel { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--bg-card); }
        .patch-panel-header { padding: 1rem; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.2); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .patch-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .patch-item {
            display: flex; align-items: center; gap: 10px; padding: 10px;
            border-bottom: 1px solid var(--line); cursor: pointer; transition: background var(--transition);
        }
        .patch-item:hover { background: var(--bg-hover); }
        .patch-item.selected { background: rgba(92,200,255,0.15); border-color: var(--accent); }
        .patch-item .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-bright); flex-shrink: 0; }
        .patch-item.selected .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .patch-item .name { flex: 1; font-size: 0.85rem; font-family: var(--font-mono); }
        .patch-item .type { font-size: 0.7rem; color: var(--text-muted); margin-left: auto; }
        .patch-actions { padding: 1rem; border-top: 1px solid var(--line); background: var(--bg-panel); display: flex; gap: 8px; }
        .patch-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

        /* ===== Monitoring ===== */
        .mon-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
        .mon-box {
            background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg);
            padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;
        }
        .mon-box .header { display: flex; justify-content: space-between; align-items: center; }
        .mon-box .name { font-weight: 700; font-size: 0.9rem; }
        .mon-meters { display: flex; gap: 0.5rem; }
        .meter { flex: 1; height: 24px; background: var(--bg-dark); border: 1px solid var(--line); border-radius: 4px; position: relative; overflow: hidden; }
        .meter-fill { height: 100%; background: linear-gradient(90deg, var(--success), var(--accent)); width: 45%; transition: width 0.3s ease; }
        .meter-label { position: absolute; top: -18px; left: 0; font-size: 0.65rem; color: var(--text-muted); font-family: var(--font-mono); }
        .meter-value { position: absolute; bottom: -16px; right: 4px; font-size: 0.65rem; color: var(--text-secondary); font-family: var(--font-mono); }

        /* ===== Device Tree ===== */
        .device-section { display: flex; gap: 1rem; height: calc(100vh - 280px); }
        .device-tree { width: 300px; border-right: 1px solid var(--line); background: var(--bg-card); border-radius: var(--radius-lg); overflow: auto; display: flex; flex-direction: column; }
        .device-tree-header { padding: 1rem; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 0.85rem; }
        .device-list { flex: 1; padding: 0.5rem; overflow-y: auto; }
        .device-node { padding: 10px 12px; cursor: pointer; font-size: 0.85rem; border-left: 3px solid transparent; transition: all var(--transition); }
        .device-node:hover { background: var(--bg-hover); border-left-color: var(--accent); }
        .device-node.active { background: var(--bg-hover); border-left-color: var(--accent); color: var(--accent); }
        .device-node .d-name { font-weight: 600; color: var(--text-primary); }
        .device-node .d-status { font-size: 0.7rem; margin-left: auto; }
        .device-panel { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--bg-card); }
        .device-panel-header { padding: 1rem; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.2); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .device-controls { flex: 1; padding: 1.5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; overflow-y: auto; }
        .ctrl-btn { background: var(--bg-dark); border: 1px solid var(--line-bright); color: var(--text-primary); padding: 12px 8px; border-radius: var(--radius); font-size: 0.8rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all var(--transition); }
        .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
        .ctrl-btn .icon { font-size: 1.4rem; }
        .ctrl-btn .name { font-size: 0.7rem; }

        /* ===== NAP / Runbook / Tools ===== */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .section-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        /* ===== Toast ===== */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast {
            background: var(--bg-surface, var(--bg-panel));
            border: 1px solid var(--line);
            border-left: 4px solid var(--accent);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            min-width: 280px;
        }
        .toast.error { border-left-color: var(--fail); }
        .toast.success { border-left-color: var(--success); }
        .toast.warn { border-left-color: var(--warn); }
        .toast .icon { font-size: 1.25rem; margin-right: 10px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ===== SSE Pill ===== */
        .sse-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 600; }
        .sse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
        .sse-dot.live { background: var(--success); animation: pulse 2s infinite; }

        /* ===== Responsive ===== */
        @media (max-width: 1200px) {
            .router-section, .rack-section, .patch-section, .device-section { flex-direction: column; height: auto; min-height: 400px; }
            .router-sidebar, .device-tree { width: 100%; height: 300px; border-right: none; border-bottom: 1px solid var(--line); }
            .rack-canvas { height: 450px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo">
                    <div class="logo-icon">⚡</div>
                    <div class="app-name">Zeus Broadcast Orchestrator</div>
                </div>
                <div class="env-switcher">
                    <span class="env-label">Environment</span>
                    <select class="env-select" id="envSelect">
                        <option value="on-prem">On-Premise</option>
                        <option value="cloud">Cloud</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>
            </div>
            <div class="topbar-center">
                <div class="sys-status">
                    <span class="sys-dot" id="sysDot"></span>
                    <span id="sysText">System Healthy</span>
                </div>
                <div class="timecode" id="timecode">12:00:00:00</div>
            </div>
            <div class="topbar-right">
                <div class="sse-pill" id="ssePill">
                    <span class="sse-dot" id="sseDot"></span>
                    <span id="sseText">Connecting…</span>
                </div>
                <div class="user-menu">
                    <button>Operator</button>
                </div>
            </div>
        </header>

        <div class="main-body">
            <aside class="sidebar">
                <div class="nav-item active" onclick="switchModule('dashboard')" title="Dashboard">
                    <span class="icon">📊</span><span class="label">Dashboard</span>
                </div>

                    <span class="icon">🔐</span><span class="label">Security</span>

                    <span class="icon">🚩</span><span class="label">Tallies</span>
                </div>

                </div>

            <div class="workspace">
                <div class="workspace-header">
                    <div class="ws-title" id="wsTitle">Dashboard <span class="badge" id="wsBadge">Live</span></div>
                    <div class="ws-actions">
                        <button onclick="refreshModule()">Refresh</button>
                        <button class="primary" onclick="exportConfig()">Export Config</button>
                    </div>
                </div>
                <div class="workspace-content" id="wsContent">
                    <!-- Modules injected here -->
                </div>
            </div>
        </div>

        <footer class="statusbar">
            <div id="statusLeft">ZEUS v1.0.0 · Production</div>
            <div id="statusCenter">Alarms: <span id="alarmCount">0</span></div>
            <div id="statusRight">Uptime: <span id="uptime">00:00:00</span></div>
        </footer>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_BASE = window.location.origin;
        let ws = null;
        let sse = null;
        let reconnectDelay = 1000;
        let currentModule = 'dashboard';
        let pollTimer = null;
        let uptimeStart = Date.now();

        // ===== Helpers =====
        function $el(id) { return document.getElementById(id); }
        function escapeHtml(t){ if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
        function showToast(msg,type='info'){
            const c=$el('toastContainer'); const t=document.createElement('div');
            t.className='toast '+(type==='error'?'error':type==='success'?'success':type==='warn'?'warn':'info');
            const ic={success:'✅',error:'❌',warn:'⚠️',info:'ℹ️'}[type]||'ℹ️';
            t.innerHTML='<span class="icon">'+ic+'</span><span>'+escapeHtml(msg)+'</span>';
            c.appendChild(t); setTimeout(()=>t.remove(),5000);
        }
        async function fetchAPI(ep,opts={}){
            const res=await fetch(`${API_BASE}${ep}`,{headers:{'Accept':'application/json',...(opts.headers||{}),'Content-Type':'application/json'},...opts});
            if(!res.ok) throw new Error('HTTP '+res.status);
            return await res.json();
        }

        // ===== Time =====
        function updateTime(){
            const now=new Date();
            const h=String(now.getUTCHours()).padStart(2,'0');
            const m=String(now.getUTCMinutes()).padStart(2,'0');
            const s=String(now.getUTCSeconds()).padStart(2,'0');
            const f=String(Math.floor(now.getMilliseconds()/10)).padStart(2,'0');
            $el('timecode').textContent=h+':'+m+':'+s+':'+f;
            const up=Date.now()-uptimeStart;
            const us=Math.floor(up/1000);
            const uh=Math.floor(us/3600); const um=Math.floor((us%3600)/60); const us2=us%60;
            $el('uptime').textContent=String(uh).padStart(2,'0')+':'+String(um).padStart(2,'0')+':'+String(us2).padStart(2,'0');
        }
        setInterval(updateTime,100); updateTime();

        // ===== Module Switching =====
        function switchModule(mod){
            currentModule=mod;
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            event.currentTarget.classList.add('active');
            $el('wsBadge').textContent='Live';
            renderModule(mod);
        }
        function refreshModule(){ renderModule(currentModule); showToast('Module refreshed','info'); }

        // ===== Render Modules =====
        async function renderModule(mod){
            const c=$el('wsContent');
            const titles={'dashboard':'Dashboard','router':'Router Control','rack':'Virtual Rack','patch':'Patch Bay','monitor':'Monitoring','devices':'Device Control','nap':'NAP & Runbook','tools':'Broadcast Tools'};
            $el('wsTitle').textContent=titles[mod]||mod;
            try{
                if(mod==='dashboard') c.innerHTML=await renderDashboard();
                else if(mod==='router') c.innerHTML=await renderRouter();
                else if(mod==='rack') c.innerHTML=await renderRack();
                else if(mod==='patch') c.innerHTML=await renderPatch();
                else if(mod==='monitor') c.innerHTML=await renderMonitor();
                else if(mod==='devices') c.innerHTML=await renderDevices();
                else if(mod==='nap') c.innerHTML=await renderNAP();
                else if(mod==='tools') c.innerHTML=await renderTools();
                else if(mod==='security') c.innerHTML=await renderSecurity();
                else if(mod==='tally') c.innerHTML=await renderTally();
                else if(mod==='fabric') c.innerHTML=await renderFabric();
            }catch(e){
                c.innerHTML='<div class="empty-state"><div class="icon">⚠️</div><h3>Error loading module</h3><p>'+escapeHtml(e.message)+'</p></div>';
                console.error(e);
            }
        }

        async function renderDashboard(){
            let stats={};
            try{ stats=await fetchAPI('/api/v1/stats'); }catch(e){ stats={}; }
            const rb=stats.runbooks||{}; const np=stats.naps||{}; const reg=stats.registry||{}; const net=stats.networkProtocols||{};
            return `
            <div class="stats-grid">
                <div class="stat-card"><div class="label">Verification Gates</div><div class="value">12</div><div class="sub">12 pass · 0 partial</div></div>
                <div class="stat-card"><div class="label">Runbooks</div><div class="value">${rb.total||0}</div><div class="sub">Live: ${rb.phases&&rb.phases.Live||0}</div></div>
                <div class="stat-card"><div class="label">NAP Applications</div><div class="value">${np.total||0}</div><div class="sub">Validated: ${np.phases&&np.phases.Validated||0}</div></div>
                <div class="stat-card"><div class="label">NAP Registry</div><div class="value">${reg.total||0}</div><div class="sub">Approved: ${reg.phases&&reg.phases.Approved||0}</div></div>
                <div class="stat-card"><div class="label">Routers</div><div class="value">2</div><div class="sub">SW-P-08 · Ember+</div></div>
                <div class="stat-card"><div class="label">Devices</div><div class="value">6</div><div class="sub">All online</div></div>
            </div>
            <div class="section-header"><div class="section-title"><span class="icon">🌐</span> Network Protocol Health</div></div>
            <div class="stats-grid">
                <div class="stat-card"><div class="label">BGP</div><div class="value">${net.bgp&&net.bgp.state||'—'}</div><div class="sub">Sessions: ${net.bgp&&net.bgp.sessions||'—'}</div></div>
                <div class="stat-card"><div class="label">IGMP</div><div class="value">${net.igmp&&net.igmp.state||'—'}</div><div class="sub">Groups: ${net.igmp&&net.igmp.groups||'—'}</div></div>
                <div class="stat-card"><div class="label">SRT</div><div class="value">${net.srt&&net.srt.state||'—'}</div><div class="sub">RTT: ${net.srt&&net.srt.rttMs||'—'} ms</div></div>
                <div class="stat-card"><div class="label">RIST</div><div class="value">${net.rist&&net.rist.state||'—'}</div><div class="sub">Paths: ${net.rist&&net.rist.paths||'—'}</div></div>
            </div>
            <div class="section-header" style="margin-top:2rem"><div class="section-title"><span class="icon">📋</span> Quick Actions</div></div>
            <div style="display:flex;gap:1rem;flex-wrap:wrap;">
                <button class="primary" onclick="switchModule('router')"><span class="icon">🔀</span> Router Control</button>
                <button onclick="switchModule('rack')"><span class="icon">🖼️</span> Virtual Rack</button>
                <button onclick="switchModule('patch')"><span class="icon">🔌</span> Patch Bay</button>
                <button onclick="switchModule('devices')"><span class="icon">🎛️</span> Device Control</button>
                <button onclick="switchModule('nap')"><span class="icon">📦</span> NAP & Runbook</button>
                <button onclick="switchModule('tools')"><span class="icon">🛠️</span> Broadcast Tools</button>
            </div>
            `;
        }

        // ===== Router Module =====
        async function renderRouter(){
            let routers=[];
            try{ const d=await fetchAPI('/api/v1/routing'); routers=d.routers||[]; }catch(e){ showToast('Router load failed: '+e.message,'error'); }
            return `
            <div class="router-section">
                <div class="router-sidebar">
                    <div style="padding:1rem; font-weight:700; font-size:0.85rem; border-bottom:1px solid var(--line); color:var(--accent);">ROUTERS</div>
                    <div style="padding:1rem; overflow-y:auto;">
                        ${routers.map(r=>`
                            <div style="padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--bg-dark); cursor:pointer;" onclick="selectRouter('${escapeHtml(r.id)}')">
                                <div style="font-weight:700; color:var(--text-primary);">${escapeHtml(r.name||'Router')}</div>
                                <div style="font-size:0.7rem; color:var(--text-muted);">${escapeHtml(r.type||'—')} · ${escapeHtml(r.status||'—')}</div>
                                <div style="font-size:0.7rem; color:var(--text-secondary); margin-top:4px;">${r.inputs||0} In × ${r.outputs||0} Out · ${r.crosspoints||0} XPs</div>
                            </div>
                        `).join('')||'<div style="color:var(--text-muted); font-size:0.85rem;">No routers</div>'}
                    </div>
                </div>
                <div class="router-main">
                    <div class="router-controls">
                        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Router Grid — Click cell to take route</span>
                        <div style="margin-left:auto; display:flex; gap:6px;">
                            <span class="badge" style="background:var(--router-free)">Free</span>
                            <span class="badge" style="background:var(--router-active)">Active</span>
                            <span class="badge" style="background:var(--router-locked)">Locked</span>
                            <span class="badge" style="background:var(--router-protect)">Protect</span>
                        </div>
                    </div>
                    <div class="router-grid-wrap" id="routerGrid">
                        ${renderRouterGrid(routers[0]||{inputs:8,outputs:8,name:'Default'})}
                    </div>
                </div>
            </div>
            `;
        }
        function renderRouterGrid(r){
            const ins=r.inputs||8; const outs=r.outputs||8;
            let html='';
            // header row (destinations)
            html+='<div style="width:100px;height:100px;"></div>';
            for(let j=0;j<outs;j++) html+='<div style="height:100px; display:flex; align-items:center; justify-content:center; font-size:0.6rem; color:var(--text-muted); writing-mode:vertical-rl; font-weight:700;">'+escapeHtml('OUT '+(j+1))+'</div>';
            // rows
            for(let i=0;i<ins;i++){
                html+='<div style="width:100px; display:flex; align-items:center; justify-content:center; font-size:0.6rem; color:var(--text-muted); font-weight:700;">'+escapeHtml('IN '+(i+1))+'</div>';
                for(let j=0;j<outs;j++){
                    const state = Math.random()<0.15?'active': Math.random()<0.05?'locked': Math.random()<0.05?'protect':'free';
                    html+='<div class="router-cell '+state+'" onclick="takeRoute(\''+escapeHtml(r.id)+'\','+i+','+j+')"><div class="lbl">XP</div></div>';
                }
            }
            return html;
        }
        window.takeRoute=function(routerId,inIdx,outIdx){
            showToast('Route take queued: '+routerId+' IN'+(inIdx+1)+' → OUT'+(outIdx+1),'info');
            // TODO: POST /api/v1/router/take
        };
        window.selectRouter=function(id){ showToast('Router selected: '+id,'info'); };

        // ===== Rack Module =====
        async function renderRack(){
            return `
            <div class="rack-section">
                <div class="rack-canvas">
                    <div class="rack-frame">
                        <div class="rack-rail left"></div><div class="rack-rail right"></div>
                        ${renderRackSlots()}
                    </div>
                    <div class="rack-empty" id="rackEmpty" style="margin-top:2rem;">Drag equipment here (coming soon: drag & drop equipment from library)</div>
                </div>
            </div>
            `;
        }
        function renderRackSlots(){
            const equip=[
                {id:'e1',name:'Vision Mixer A',type:'video-mixer',u:2,status:'online'},
                {id:'e2',name:'Audio Console',type:'audio-mixer',u:3,status:'online'},
                {id:'e3',name:'Replay Server 1',type:'replay',u:4,status:'online'},
                {id:'e4',name:'Graphics Engine',type:'graphics',u:2,status:'online'},
                {id:'e5',name:'NAP Vision Mixer',type:'nap',u:1,status:'validated'},
                {id:'e6',name:'SRT Encoder',type:'encoder',u:1,status:'online'},
            ];
            let html='';
            let usedU=0;
            for(let i=0;i<42;i++){
                const eq=equip.find(e=>usedU===i && e.u);
                if(eq){
                    html+='<div class="rack-slot occupied" style="grid-row: span '+eq.u+';" onclick="toggleEquip(\''+eq.id+'\')">';
                    html+='<div class="rack-equip"><div class="eq-name">'+escapeHtml(eq.name)+'</div><div style="font-size:0.65rem; color:var(--text-muted);">'+escapeHtml(eq.type)+'</div><div class="eq-status"><span class="badge '+ (eq.status==='online'?'online':eq.status==='validated'?'online':'pending') +'">'+escapeHtml(eq.status)+'</span></div></div>';
                    html+='</div>';
                    i+=eq.u-1; usedU+=eq.u;
                }else{
                    html+='<div class="rack-slot" style="grid-row: span 1;" onclick="addEquipHere('+i+')">'+(i+1)+'U</div>';
                    usedU++;
                }
            }
            return html;
        }
        window.toggleEquip=function(id){ showToast('Equipment '+id+' toggled','info'); };
        window.addEquipHere=function(u){ showToast('Add equipment at '+u+'U','info'); };

        // ===== Patch Module =====
        async function renderPatch(){
            let sources=[], dests=[];
            try{
                const d=await fetchAPI('/api/v1/patch');
                sources=d.sources||[]; dests=d.dests||[];
            }catch(e){ sources=[{id:'s1',name:'Camera 1 SDI Out',type:'video'}]; dests=[{id:'d1',name:'Vision Mixer In 1',type:'video'}]; }
            return `
            <div class="patch-section">
                <div class="patch-panel">
                    <div class="patch-panel-header"><span>Sources</span><span class="badge">${sources.length}</span></div>
                    <div class="patch-list" id="patchSources">
                        ${sources.map(s=>`<div class="patch-item" onclick="selectPatchSource('${escapeHtml(s.id)}')"><div class="dot"></div><div class="name">${escapeHtml(s.name||'Source')}</div><div class="type">${escapeHtml(s.type||'—')}</div></div>`).join('')||'<div class="empty-state" style="padding:1rem;">No sources</div>'}
                    </div>
                    <div class="patch-actions">
                        <button onclick="clearPatch()">Clear Selection</button>
                        <button class="primary" onclick="createPatch()">Connect</button>
                    </div>
                </div>
                <div class="patch-panel" style="margin-left:0;">
                    <div class="patch-panel-header"><span>Destinations</span><span class="badge">${dests.length}</span></div>
                    <div class="patch-list" id="patchDests">
                        ${dests.map(d=>`<div class="patch-item" onclick="selectPatchDest('${escapeHtml(d.id)}')"><div class="dot"></div><div class="name">${escapeHtml(d.name||'Destination')}</div><div class="type">${escapeHtml(d.type||'—')}</div></div>`).join('')||'<div class="empty-state" style="padding:1rem;">No destinations</div>'}
                    </div>
                    <div class="patch-actions">
                        <button class="danger" onclick="clearPatch()">Disconnect</button>
                        <button onclick="refreshModule()">Refresh</button>
                    </div>
                </div>
            </div>
            <div style="margin-top:1rem; color:var(--text-muted); font-size:0.8rem;">Patch connections use UDP/TCP/ST 2110 per device protocol. Select source → destination → Connect.</div>
            `;
        }
        let patchSrc=null,patchDst=null;
        window.selectPatchSource=function(id){ patchSrc=id; document.querySelectorAll('#patchSources .patch-item').forEach(x=>x.classList.remove('selected')); event.currentTarget.classList.add('selected'); showToast('Source selected','info'); };
        window.selectPatchDest=function(id){ patchDst=id; document.querySelectorAll('#patchDests .patch-item').forEach(x=>x.classList.remove('selected')); event.currentTarget.classList.add('selected'); showToast('Destination selected','info'); };
        window.createPatch=function(){
            if(!patchSrc||!patchDst){ showToast('Select source and destination','warn'); return; }
            showToast('Patch '+patchSrc+' → '+patchDst+' created','success');
            patchSrc=null; patchDst=null;
        };
        window.clearPatch=function(){ patchSrc=null; patchDst=null; document.querySelectorAll('.patch-item.selected').forEach(x=>x.classList.remove('selected')); showToast('Selection cleared','info'); };

        // ===== Monitor Module =====
        async function renderMonitor(){
            return `
            <div class="mon-section">
                <div class="mon-box">
                    <div class="header"><div class="name">Program Monitor</div><span class="badge online">OK</span></div>
                    <div class="mon-meters">
                        <div class="meter"><div class="meter-fill" style="width:72%;"></div><div class="meter-label">VIDEO</div><div class="meter-value">1080i59.94</div></div>
                        <div class="meter"><div class="meter-fill" style="width:45%;"></div><div class="meter-label">AUDIO L</div><div class="meter-value">-23 LUFS</div></div>
                        <div class="meter"><div class="meter-fill" style="width:42%;"></div><div class="meter-label">AUDIO R</div><div class="meter-value">-24 LUFS</div></div>
                    </div>
                    <div style="display:flex; gap:0.5rem;">

                </div>
                <div class="mon-box">
                    <div class="header"><div class="name">Preview Monitor</div><span class="badge online">OK</span></div>
                    <div class="mon-meters">
                        <div class="meter"><div class="meter-fill" style="width:68%;"></div><div class="meter-label">VIDEO</div><div class="meter-value">1080i59.94</div></div>
                        <div class="meter"><div class="meter-fill" style="width:38%;"></div><div class="meter-label">AUDIO L</div><div class="meter-value">-25 LUFS</div></div>
                        <div class="meter"><div class="meter-fill" style="width:40%;"></div><div class="meter-label">AUDIO R</div><div class="meter-value">-24 LUFS</div></div>
                    </div>
                    <div style="display:flex; gap:0.5rem;">
                        <button onclick="muteMonitor('mon-2')">Mute</button>
                        <button>Fullscreen</button>
                    </div>
                </div>
                <div class="mon-box">
                    <div class="header"><div class="name">Multiviewer A</div><span class="badge online">8 Sources</span></div>
                    <div style="display:grid; grid-template-columns: repeat(4,1fr); gap:4px; height:120px;">
                        ${Array(8).fill().map((_,i)=>`<div style="background:#0f172a; border:1px solid var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:0.65rem; color:var(--text-muted);">CAM ${i+1}</div>`).join('')}
                    </div>
                </div>
                <div class="mon-box">
                    <div class="header"><div class="name">System Alarms</div><span class="badge idle">None</span></div>
                    <div style="color:var(--text-muted); font-size:0.8rem;">No active alarms</div>
                </div>
            </div>
            `;
        }
        window.muteMonitor=function(id){ showToast('Monitor '+id+' muted','info'); };

        // ===== Devices Module =====
        async function renderDevices(){
            let devices=[];
            try{ const d=await fetchAPI('/api/v1/devices'); devices=d.devices||[]; }catch(e){ devices=[]; }
            if(devices.length===0){
                devices=[
                    {id:'cam1',name:'Camera 1',type:'camera',status:'online'},
                    {id:'cam2',name:'Camera 2',type:'camera',status:'online'},
                    {id:'aud1',name='Audio Console',type:'audio',status:'online'},
                    {id:'rep1',name='Replay Server',type:'replay',status:'online'},
                    {id:'gfx1',name='Graphics Engine',type:'graphics',status:'online'},

            }
            return `

                    <div class="device-tree-header">DEVICES</div>
                    <div class="device-list">
                        ${devices.map(d=>`
                            <div class="device-node ${d.id==='cam1'?'active':''}" onclick="selectDevice('${escapeHtml(d.id)}')">

                                <div class="d-status"><span class="badge ${d.status==='online'?'online':'offline'}">${escapeHtml(d.status||'—')}</span></div>

                            </div>
                        `).join('')}

                <div class="device-panel">

        window.selectDevice=function(id){
            $el('devPanelHeader').textContent='Device: '+id;
            const controls={
                cam1:[{icon:'🔴',name:'Record'},{icon:'⏹',name:'Stop'},{icon:'⏯',name:'Play'},{icon:'🔍',name:'Focus'},{icon:'💡',name:'Iris'},{icon:'🔄',name:'Zoom'}],
                cam2:[{icon:'🔴',name:'Record'},{icon:'⏹',name:'Stop'},{icon:'⏯',name:'Play'},{icon:'🔍',name:'Focus'},{icon:'💡',name:'Iris'},{icon:'🔄',name:'Zoom'}],
                aud1:[{icon:'🔊',name:'Mic 1'},{icon:'🔊',name:'Mic 2'},{icon:'📊',name:'Meter'},{icon:'🔇',name:'Mute All'},{icon:'⚙️',name:'Gain'},{icon:'🎧',name:'Headphone'}],
                rep1:[{icon:'🔴',name:'Record'},{icon:'⏹',name:'Stop'},{icon:'⏯',name:'Play'},{icon:'⏪',name:'Rewind'},{icon:'⏩',name:'FastFwd'},{icon:'📼',name:'Load Clip'}],
                gfx1:[{icon:'🎨',name:'Lower 3rd'},{icon:'📊',name:'Scoreboard'},{icon:'🖼️',name:'Logo'},{icon:'🎬',name:'Play Clip'},{icon:'⏹',name:'Stop'},{icon:'⚙️',name:'Template'}],

        // ===== Tally Actions =====
        window.tallyRoute=function(){

            if(!router||!source||!dest){ showToast('Fill router, source, destination','warn'); return; }

                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({routerID:router,sourceID:source,destinationID:dest})

            const dest=document.getElementById('tallyClearDest').value;

        window.fabricScale=function(clusterID){

            if(replicas===null) return;
            fetch(`${API_BASE}/api/v1/infrastructure/fabric/scale`,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({clusterID:clusterID,namespace:'default',name:'zeus-kernel',replicas:parseInt(replicas)||1})
            }).then(r=>r.ok?showToast('Cluster scaled','success'):showToast('Scale failed','error'))
              .catch(e=>showToast('Scale error: '+e.message,'error'));
        };
        window.scaleNap=function(){
            const name=document.getElementById('scaleNap').value;
            const replicas=parseInt(document.getElementById('scaleReplicas').value)||1;
            if(!name){ showToast('Enter NAP name','warn'); return; }
            fetch(`${API_BASE}/api/v1/infrastructure/fabric/scale`,{

                headers:{'Content-Type':'application/json'},

                body:JSON.stringify({namespace:'default',napName:name,onPremReplicas:onPrem,cloudReplicas:cloud})

            showToast('Environment switched to '+this.value,'info');
            // TODO: reconnect API/WebSocket to new environment endpoint
        });

        // ===== SSE Connection with reconnection =====
        function connectSSE(){
            if(sse){ try{sse.close();}catch(e){} sse=null; }
            if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }

            var sseTimeout = setTimeout(function(){
                if(!sse){
                    // SSE never opened - fall back to polling silently
                    $el('sseDot').className='sse-dot';
                    $el('sseDot').style.backgroundColor='var(--warn)';
                    $el('sseText').textContent='Polling (SSE unavailable)';
                    if(!pollTimer){
                        pollTimer=setInterval(()=>{ renderModule(currentModule); },15000);
                    }
                }
            }, 5000);

            sse=new EventSource(`${API_BASE}/api/v1/events`);
            sse.onopen=()=>{
                clearTimeout(sseTimeout);
                reconnectDelay=1000;
                $el('sseDot').className='sse-dot live';
                $el('sseText').textContent='Live';
                showToast('Real-time connection established','success');
            };
            sse.onmessage=(ev)=>{
                try{ const d=JSON.parse(ev.data); if(d.event==='stats'){ /* stats update handled by dashboard poll */ } }catch(e){}
            };
            sse.onerror=()=>{
                clearTimeout(sseTimeout);
                $el('sseDot').className='sse-dot';
                $el('sseDot').style.backgroundColor='var(--fail)';
                $el('sseText').textContent='Reconnecting…';
                try{sse.close();}catch(e){} sse=null;
                if(!pollTimer){
                    pollTimer=setInterval(()=>{ renderModule(currentModule); },15000);
                    showToast('Real-time connection lost - polling fallback','error');
                }
                setTimeout(()=>{ if(!sse) connectSSE(); },reconnectDelay);
                reconnectDelay=Math.min(reconnectDelay*2,30000);
            };
        }

        // ===== Init =====
        document.addEventListener('DOMContentLoaded',()=>{
            renderModule('dashboard');
            connectSSE();
        });
    </script>
