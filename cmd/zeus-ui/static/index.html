<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeus Broadcast Orchestrator — Operator Console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
    <style>
        /* ============================================================================
           ZEUS BROADCAST ORCHESTRATOR — UNIFIED OPERATOR CONSOLE
           Professional Broadcast Control-Room Design
           ============================================================================ */
        :root {
            /* Core palette — dark charcoal broadcast room */
            --bg-dark: #07090b;
            --bg-panel: #0e1318;
            --bg-card: #141a22;
            --bg-hover: #1d2630;
            --line: #232d39;
            --line-bright: #3a4758;
            --text-primary: #e8eef2;
            --text-secondary: #a8b4c1;
            --text-muted: #6b7684;
            --accent: #ffb703;           /* broadcast amber */
            --accent-hover: #ffc94d;
            --accent-glow: rgba(255, 183, 3, 0.25);
            --success: #2ecc71;
            --success-dim: rgba(46, 204, 113, 0.15);
            --success-border: rgba(46, 204, 113, 0.35);
            --warn: #f1c40f;
            --fail: #e74c3c;
            --fail-dim: rgba(231, 76, 60, 0.15);
            --fail-border: rgba(231, 76, 60, 0.35);
            --info: #3498db;
            --router-free: #141a22;
            --router-active: #2ecc71;
            --router-locked: #e74c3c;
            --router-protect: #f1c40f;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.5), 0 2px 4px -2px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.5);
            --radius: 8px;
            --radius-lg: 12px;
            --transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Roboto Mono', monospace;
            --rack-unit-h: 38px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-ui);
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }

        button {
            background: var(--bg-panel);
            border: 1px solid var(--line);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: 0.2px;
        }
        button:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.primary {
            background: var(--accent);
            color: #0a1218;
            border-color: var(--accent);
        }
        button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        button.danger { border-color: var(--fail-border); color: var(--fail); }
        button.danger:hover { background: var(--fail-dim); border-color: var(--fail); }
        button.secondary { background: transparent; border: 1px solid var(--line-bright); }
        button.on { background: var(--success-dim); border-color: var(--success-border); color: var(--success); }
        button.on:hover { background: var(--success-dim); border-color: var(--success); color: var(--success); }
        button.off { background: var(--fail-dim); border-color: var(--fail-border); color: var(--fail); }
        button.off:hover { background: var(--fail-dim); border-color: var(--fail); color: var(--fail); }

        /* ===== App Shell ===== */
        #app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }

        /* ===== Top Bar ===== */
        header.topbar {
            background: linear-gradient(180deg, var(--bg-panel), #0c1015);
            border-bottom: 2px solid var(--line);
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            flex-shrink: 0;
            z-index: 100;
        }
        .topbar-left { display: flex; align-items: center; gap: 1rem; }
        .topbar-center { display: flex; align-items: center; gap: 1rem; flex: 1; justify-content: center; }
        .topbar-right { display: flex; align-items: center; gap: 1rem; }

        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.5px; color: var(--text-primary); }
        .logo-icon {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--accent), #ff8c00);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .app-name { font-size: 1.15rem; }

        .env-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--line-bright);
            border-radius: var(--radius);
            padding: 4px 10px;
        }
        .env-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .env-select {
            background: transparent;
            border: 1px solid var(--line-bright);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            font-family: inherit;
        }
        .env-select option { background: var(--bg-panel); color: var(--text-primary); }

        .sys-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        .sys-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
        .sys-dot.degraded { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
        .sys-dot.down { background: var(--fail); box-shadow: 0 0 8px var(--fail); }
        .sys-dot.pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .timecode {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            background: #05080c;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--line);
            color: var(--accent);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }

        .user-menu { display: flex; align-items: center; gap: 8px; }

        /* ===== Main Body ===== */
        .main-body { display: flex; flex: 1; overflow: hidden; }

        /* ===== Sidebar ===== */
        aside.sidebar {
            width: 64px;
            background: var(--bg-panel);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 0.5rem;
            flex-shrink: 0;
            z-index: 50;
        }
        .nav-item {
            width: 44px; height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all var(--transition);
            color: var(--text-muted);
            position: relative;
            font-size: 1.25rem;
        }
        .nav-item:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
        .nav-item.active { background: var(--accent); color: #0a1218; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .nav-item .label { position: absolute; bottom: -26px; font-size: 0.66rem; white-space: nowrap; opacity: 0; transition: opacity var(--transition); pointer-events: none; }
        .nav-item:hover .label { opacity: 1; }

        /* ===== Workspace ===== */
        .workspace { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }

        .workspace-header {
            background: linear-gradient(180deg, var(--bg-panel), #0c1015);
            border-bottom: 1px solid var(--line);
            height: 48px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; flex-shrink: 0;
        }
        .ws-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .ws-actions { display: flex; gap: 8px; }

        .workspace-content { flex: 1; overflow: auto; padding: 1.5rem; background: var(--bg-dark); }

        /* ===== Bottom Status Bar ===== */
        footer.statusbar {
            background: linear-gradient(180deg, #0c1015, var(--bg-panel));
            border-top: 1px solid var(--line);
            height: 34px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; flex-shrink: 0;
            font-size: 0.78rem; color: var(--text-muted);
        }

        /* ===== Stat Cards ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            display: flex; flex-direction: column; gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent); opacity: 0.6;
        }
        .stat-card .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
        .stat-card .value { font-size: 1.9rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-mono); }
        .stat-card .sub { font-size: 0.78rem; color: var(--text-secondary); }

        /* ===== Tables ===== */
        .table-container { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-card); }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { background: rgba(7, 10, 13, 0.6); color: var(--text-secondary); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 12px; text-align: left; font-weight: 700; border-bottom: 1px solid var(--line); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--text-primary); }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255, 183, 3, 0.04); }

        /* ===== Badges ===== */
        .badge {
            display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 12px;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.4px;
        }
        .badge.online { background: var(--success-dim); color: var(--success); border: 1px solid var(--success-border); }
        .badge.offline { background: var(--fail-dim); color: var(--fail); border: 1px solid var(--fail-border); }
        .badge.degraded { background: rgba(241, 196, 15, 0.15); color: var(--warn); border: 1px solid rgba(241, 196, 15, 0.35); }
        .badge.pending { background: rgba(107, 118, 132, 0.15); color: var(--text-muted); border: 1px solid rgba(107, 118, 132, 0.3); }
        .badge.active { background: rgba(52, 152, 219, 0.15); color: var(--info); border: 1px solid rgba(52, 152, 219, 0.3); }
        .badge.idle { background: rgba(107, 118, 132, 0.15); color: var(--text-muted); border: 1px solid rgba(107, 118, 132, 0.3); }
        .badge.success { background: var(--success-dim); color: var(--success); border: 1px solid var(--success-border); }
        .badge.fail { background: var(--fail-dim); color: var(--fail); border: 1px solid var(--fail-border); }
        .badge.warn { background: rgba(241, 196, 15, 0.15); color: var(--warn); border: 1px solid rgba(241, 196, 15, 0.35); }
        .badge.validated { background: var(--success-dim); color: var(--success); border: 1px solid var(--success-border); }

        /* ===== Code ===== */
        code { font-family: var(--font-mono); font-size: 0.82rem; background: rgba(7, 10, 13, 0.6); padding: 2px 6px; border-radius: 4px; color: #a5f3fc; }

        /* ===== Empty State ===== */
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 1rem; display: block; }
        .empty-state h3 { color: var(--text-primary); margin-bottom: 0.5rem; }

        /* ===== Section Headers ===== */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .section-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .section-title .icon { color: var(--accent); }

        /* ===== Router Grid ===== */
        .router-section { display: flex; gap: 1rem; height: calc(100vh - 280px); }
        .router-sidebar { width: 300px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
        .router-main { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .router-controls { padding: 1rem; border-bottom: 1px solid var(--line); background: var(--bg-card); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .router-grid-wrap { flex: 1; overflow: auto; padding: 1rem; display: grid; gap: 4px; align-content: start; }
        .router-corner, .router-col-label, .router-row-label {
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; color: var(--text-muted); font-weight: 700;
            letter-spacing: 0.4px; text-transform: uppercase;
        }
        .router-corner { text-align: center; line-height: 1.2; }
        .router-col-label { min-height: 34px; border-bottom: 1px solid var(--line); }
        .router-row-label { min-height: 34px; justify-content: flex-end; padding-right: 10px; border-right: 1px solid var(--line); }
        .router-cell {
            height: 34px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--router-free);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.62rem; font-weight: 700; color: var(--text-muted);
            cursor: pointer; transition: all var(--transition);
            position: relative;
            font-family: var(--font-mono);
        }
        .router-cell:hover { border-color: var(--accent); transform: translateY(-1px); z-index: 2; box-shadow: var(--shadow); }
        .router-cell.active { background: var(--router-active); color: #0a1218; border-color: var(--success); box-shadow: 0 0 10px rgba(46,204,113,0.3); }
        .router-cell.locked { background: var(--router-locked); color: #fff; border-color: var(--fail); box-shadow: 0 0 10px rgba(231,76,60,0.3); cursor: not-allowed; }
        .router-cell.protect { background: var(--router-protect); color: #0a1218; border-color: var(--warn); box-shadow: 0 0 10px rgba(241,196,15,0.3); }
        .router-cell .xp { font-size: 0.7rem; }
        .router-card {
            padding: 10px; border: 1px solid var(--line); border-radius: 8px;
            margin-bottom: 8px; background: var(--bg-dark); cursor: pointer;
            transition: all var(--transition);
        }
        .router-card:hover { border-color: var(--line-bright); background: var(--bg-hover); }
        .router-card.selected { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }

        /* ===== Rack System ===== */
        .rack-section { display: flex; gap: 1rem; height: calc(100vh - 280px); }
        .rack-canvas { flex: 1; background: radial-gradient(circle at center, rgba(30,40,55,0.15) 0%, transparent 70%), linear-gradient(180deg, rgba(255,255,255,0.01) 0%, rgba(0,0,0,0) 100%); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.5rem; position: relative; overflow: auto; }
        .rack-frame {
            width: 640px; border: 3px solid var(--line-bright); border-radius: 8px;
            background: var(--bg-card); position: relative; padding: 0.5rem; margin: 0 auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }
        .rack-rail { position: absolute; top: 0.5rem; bottom: 0.5rem; width: 16px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .rack-rail.left { left: -26px; }
        .rack-rail.right { right: -26px; }
        .rack-u { width: 100%; height: var(--rack-unit-h); border-top: 1px dashed rgba(255,255,255,0.06); }
        .rack-slot {
            height: var(--rack-unit-h); border: 1px solid var(--line);
            border-radius: 6px; background: var(--bg-dark);
            margin-bottom: 4px; cursor: pointer; position: relative;
            display: flex; align-items: center; justify-content: center; font-size: 0.7rem;
            transition: all var(--transition);
        }
        .rack-slot:hover { border-color: var(--accent); background: var(--bg-hover); }
        .rack-slot.occupied { background: var(--bg-card); border-color: var(--accent); }
        .rack-equip { width: 100%; height: 100%; border-radius: 5px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--line-bright); display: flex; flex-direction: column; padding: 6px; font-size: 0.7rem; color: var(--text-secondary); overflow: hidden; transition: all var(--transition); }
        .rack-equip.powered-off { opacity: 0.45; filter: grayscale(1); }
        .rack-equip .eq-name { font-weight: 700; color: var(--text-primary); margin-bottom: 4px; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rack-equip .eq-status { font-size: 0.65rem; margin-top: auto; }
        .rack-empty { text-align: center; color: var(--text-muted); padding: 2rem; font-size: 0.9rem; }

        /* ===== Patch Bay ===== */
        .patch-section { display: flex; gap: 1rem; height: calc(100vh - 280px); }
        .patch-panel { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--bg-card); }
        .patch-panel-header { padding: 1rem; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.2); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .patch-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .patch-item {
            display: flex; align-items: center; gap: 10px; padding: 10px;
            border-bottom: 1px solid var(--line); cursor: pointer; transition: background var(--transition);
        }
        .patch-item:hover { background: var(--bg-hover); }
        .patch-item.selected { background: rgba(255, 183, 3, 0.12); border-color: var(--accent); }
        .patch-item .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-bright); flex-shrink: 0; box-shadow: 0 0 6px rgba(0,0,0,0.8); }
        .patch-item.selected .dot { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        .patch-item .name { flex: 1; font-size: 0.82rem; font-family: var(--font-mono); }
        .patch-item .type { font-size: 0.7rem; color: var(--text-muted); margin-left: auto; }
        .patch-actions { padding: 1rem; border-top: 1px solid var(--line); background: var(--bg-panel); display: flex; gap: 8px; justify-content: space-between; }
        .patch-connection { margin-top: 1rem; padding: 1rem; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); }

        /* ===== Monitoring ===== */
        .mon-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
        .mon-box {
            background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg);
            padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;
            position: relative;
            overflow: hidden;
        }
        .mon-box::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: var(--info); opacity: 0.5;
        }
        .mon-box .header { display: flex; justify-content: space-between; align-items: center; }
        .mon-box .name { font-weight: 700; font-size: 0.85rem; }
        .mon-meters { display: flex; gap: 0.5rem; }
        .meter { flex: 1; height: 22px; background: #0a1016; border: 1px solid var(--line); border-radius: 4px; position: relative; overflow: hidden; }
        .meter-fill { height: 100%; background: linear-gradient(90deg, var(--success), var(--accent)); width: 45%; transition: width 0.4s ease; }
        .meter-label { position: absolute; top: -16px; left: 0; font-size: 0.62rem; color: var(--text-muted); font-family: var(--font-mono); }
        .meter-value { position: absolute; bottom: -16px; right: 4px; font-size: 0.62rem; color: var(--text-secondary); font-family: var(--font-mono); }

        /* ===== Device Tree ===== */
        .device-section { display: flex; gap: 1rem; height: calc(100vh - 280px); }
        .device-tree { width: 300px; border-right: 1px solid var(--line); background: var(--bg-card); border-radius: var(--radius-lg); overflow: auto; display: flex; flex-direction: column; }
        .device-tree-header { padding: 1rem; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .device-list { flex: 1; padding: 0.5rem; overflow-y: auto; }
        .device-node { padding: 10px 12px; cursor: pointer; font-size: 0.82rem; border-left: 3px solid transparent; transition: all var(--transition); display: flex; justify-content: space-between; align-items: center; }
        .device-node:hover { background: var(--bg-hover); border-left-color: var(--accent); }
        .device-node.active { background: var(--bg-hover); border-left-color: var(--accent); color: var(--accent); }
        .device-node .d-info { display: flex; gap: 8px; align-items: center; flex: 1; }
        .device-node .d-name { font-weight: 600; color: var(--text-primary); }
        .device-node .d-type { font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-mono); }
        .device-node .d-status { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: var(--line); color: var(--text-secondary); }
        .device-node .d-status.online { background: var(--success-dim); color: var(--success); border: 1px solid var(--success-border); }
        .device-node .d-status.offline { background: var(--fail-dim); color: var(--fail); border: 1px solid var(--fail-border); }
        .device-panel { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--bg-card); }
        .device-panel-header { padding: 1rem; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.2); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; }
        .device-panel-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); }
        .device-controls { flex: 1; padding: 1.5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1rem; overflow-y: auto; }
        .ctrl-btn { background: var(--bg-dark); border: 1px solid var(--line-bright); color: var(--text-primary); padding: 14px 8px; border-radius: var(--radius); font-size: 0.78rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all var(--transition); }
        .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
        .ctrl-btn:active { transform: scale(0.98); }
        .ctrl-btn .icon { font-size: 1.5rem; }
        .ctrl-btn .name { font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cmd-history { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: 1rem; }
        .cmd-history h4 { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.5px; }
        .cmd-list { max-height: 200px; overflow-y: auto; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-secondary); }
        .cmd-entry { padding: 4px 6px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
        .cmd-time { color: var(--text-muted); }

        /* ===== Toast ===== */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast {
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-left: 4px solid var(--accent);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            pointer-events: auto;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast.error { border-left-color: var(--fail); }
        .toast.success { border-left-color: var(--success); }
        .toast.warn { border-left-color: var(--warn); }
        .toast .icon { font-weight: 700; }

        /* ===== SSE dots ===== */
        .sse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); }
        .sse-dot.live { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
        .sse-dot.fail { background: var(--fail); box-shadow: 0 0 8px var(--fail); }

        /* ===== Horizontal divider ===== */
        .divider { height: 1px; background: var(--line); margin: 1.5rem 0; }

        /* Modal */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.5rem; width: 420px; box-shadow: var(--shadow-lg); }
        .modal h3 { margin-bottom: 1rem; font-size: 1rem; color: var(--text-primary); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
    </style>
</head>
<body>
<div id="app">
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <div class="app-name">ZEUS Broadcast Orchestrator</div>
            </div>
        </div>
        <div class="topbar-center">
            <div class="env-switcher">
                <span class="env-label">Environment</span>
                <select class="env-select" id="envSelect">
                    <option>on-prem (kind)</option>
                    <option>cloud (aws)</option>
                    <option>hybrid</option>
                </select>
            </div>
        </div>
        <div class="topbar-right">
            <div class="sys-status" id="sysStatus">
                <div class="sys-dot down" id="sysDot"></div>
                <span id="sysText">Cluster Unreachable</span>
            </div>
            <div class="timecode" id="timecode">00:00:00:00</div>
            <div class="user-menu">
                <span style="font-size:0.75rem;color:var(--text-muted);">Operator</span>
            </div>
        </div>
    </header>

    <div class="main-body">
        <aside class="sidebar">
            <div class="nav-item" data-module="dashboard" onclick="switchModule('dashboard')" title="Dashboard">📊<div class="label">Dashboard</div></div>
            <div class="nav-item" data-module="router" onclick="switchModule('router')" title="Router Control">🔀<div class="label">Router</div></div>
            <div class="nav-item" data-module="rack" onclick="switchModule('rack')" title="Virtual Rack">🖼️<div class="label">Rack</div></div>
            <div class="nav-item" data-module="patch" onclick="switchModule('patch')" title="Patch Bay">🔌<div class="label">Patch</div></div>
            <div class="nav-item" data-module="monitor" onclick="switchModule('monitor')" title="Monitoring">📺<div class="label">Monitor</div></div>
            <div class="nav-item" data-module="devices" onclick="switchModule('devices')" title="Device Control">🎛️<div class="label">Devices</div></div>
            <div class="nav-item" data-module="nap" onclick="switchModule('nap')" title="NAP & Runbook">📦<div class="label">NAP</div></div>
            <div class="nav-item" data-module="tools" onclick="switchModule('tools')" title="Broadcast Tools">🛠️<div class="label">Tools</div></div>
            <div class="nav-item" data-module="security" onclick="switchModule('security')" title="Security">🔐<div class="label">Security</div></div>
            <div class="nav-item" data-module="tally" onclick="switchModule('tally')" title="Signal Tallies">🚩<div class="label">Tallies</div></div>
            <div class="nav-item" data-module="fabric" onclick="switchModule('fabric')" title="Fabric & Scale">☁️<div class="label">Fabric</div></div>
        </aside>

        <div class="workspace">
            <div class="workspace-header">
                <div class="ws-title" id="wsTitle">Dashboard</div>
                <div class="ws-actions">
                    <button class="secondary" onclick="refreshModule()">Refresh</button>
                    <button class="primary" onclick="window.exportConfig()">Export Config</button>
                </div>
            </div>
            <div class="workspace-content" id="wsContent"></div>
        </div>
    </div>

    <footer class="statusbar">
        <div id="footerLeft">ZEUS v1.0.0 · Production</div>
        <div id="footerRight">
            <span id="sseIndicator"><span class="sse-dot" id="sseDot"></span> <span id="sseText">Connecting…</span></span>
            <span style="margin:0 8px;">|</span>
            <span id="alarmLabel">Alarms: <span id="alarmCount" style="font-family:var(--font-mono);">0</span></span>
        </div>
    </footer>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <h3 id="modalTitle">Confirm</h3>
        <div id="modalBody"></div>
        <div class="modal-actions">
            <button class="secondary" onclick="hideModal()">Cancel</button>
            <button class="primary" id="modalConfirmBtn" onclick="confirmModal()">Confirm</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = '';
    let currentModule = 'dashboard';
    let __routers = [];
    let __selectedRouter = null;
    let __selectedDevice = null;
    let __patchSrc = null, __patchDst = null;
    let sse = null, pollTimer = null, reconnectDelay = 1000;
    let sseToastShown = false;
    let uptimeStart = Date.now();
    let pendingModal = null;

    // ===== Helpers =====
    function $el(id){ return document.getElementById(id); }
    function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function showToast(msg,type='info'){
        const c=$el('toastContainer'); const t=document.createElement('div');
        t.className='toast '+type;
        const ic={success:'✅',error:'❌',warn:'⚠️',info:'ℹ️'}[type]||'ℹ️';
        t.innerHTML='<span class="icon">'+ic+'</span><span>'+escapeHtml(msg)+'</span>';
        c.appendChild(t); setTimeout(()=>t.remove(),4000);
    }
    function fetchAPI(ep,opts={}){
        const ctrl=new AbortController();
        const t=setTimeout(()=>ctrl.abort(),8000);
        return fetch(`${API_BASE}${ep}`,{headers:{'Accept':'application/json',...(opts.headers||{}),'Content-Type':'application/json'},...opts,signal:ctrl.signal})
            .then(res=>{ clearTimeout(t); if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
            .catch(e=>{ clearTimeout(t); throw e; });
    }

    // ===== Modal =====
    function showModal(title,body,onConfirm){
        pendingModal=onConfirm;
        $el('modalTitle').textContent=title;
        $el('modalBody').innerHTML=body;
        $el('modalBackdrop').style.display='flex';
    }
    function hideModal(){ $el('modalBackdrop').style.display='none'; pendingModal=null; }
    window.confirmModal=function(){ if(pendingModal){ pendingModal(); } hideModal(); };
    document.getElementById('modalBackdrop').addEventListener('click',function(e){ if(e.target===this) hideModal(); });

    // ===== Time =====
    function updateTime(){
        const now=new Date();
        const h=String(now.getUTCHours()).padStart(2,'0');
        const m=String(now.getUTCMinutes()).padStart(2,'0');
        const s=String(now.getUTCSeconds()).padStart(2,'0');
        const f=String(Math.floor(now.getMilliseconds()/10)).padStart(2,'0');
        $el('timecode').textContent=h+':'+m+':'+s+':'+f;
        const up=Date.now()-uptimeStart;
        const us=Math.floor(up/1000);
        const uh=Math.floor(us/3600); const um=Math.floor((us%3600)/60); const us2=us%60;
        $el('footerLeft').textContent='ZEUS v1.0.0 · Production  ·  Uptime '+String(uh).padStart(2,'0')+':'+String(um).padStart(2,'0')+':'+String(us2).padStart(2,'0');
    }
    setInterval(updateTime,100); updateTime();

    // ===== System Status =====
    function setSystemStatus(reachable){
        const dot=$el('sysDot'); const text=$el('sysText');
        if(!dot||!text) return;
        dot.className='sys-dot'+(reachable?' live':' down');
        text.textContent=reachable?'Cluster Reachable':'Cluster Unreachable';
    }

    // ===== Module Switching =====
    function switchModule(mod){
        currentModule=mod;
        document.querySelectorAll('.nav-item').forEach(n=>{
            n.classList.toggle('active', n.dataset.module === mod);
        });
        $el('wsTitle').textContent={
            dashboard:'Dashboard',router:'Router Control',rack:'Virtual Rack',patch:'Patch Bay',
            monitor:'Monitoring',devices:'Device Control',nap:'NAP & Runbook',tools:'Broadcast Tools',
            security:'Security',tally:'Signal Tallies',fabric:'Fabric & Scale'
        }[mod]||mod;
        renderModule(mod);
    }
    function refreshModule(){ renderModule(currentModule); showToast('Module refreshed','info'); }

    window.exportConfig=async function(){
        try{
            const results=await Promise.allSettled([
                fetchAPI('/api/v1/zeusrunbooks'),
                fetchAPI('/api/v1/zeusapplicationpackages'),
                fetchAPI('/api/v1/napregistry'),
                fetchAPI('/api/v1/routing')
            ]);
            const pick=(i,key,fallback)=>results[i].status==='fulfilled'?(results[i].value[key]||fallback):fallback;
            const payload={
                exportedAt:new Date().toISOString(),
                environment:$el('envSelect').value,
                runbooks:pick(0,'runbooks',[]),
                naps:pick(1,'naps',[]),
                registry:pick(2,'registries',[]),
                routers:pick(3,'routers',[])
            };
            const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
            const url=URL.createObjectURL(blob);
            const link=document.createElement('a');
            link.href=url;
            link.download='zeus-config-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';
            document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
            showToast('Configuration exported','success');
        }catch(e){ showToast('Export failed: '+e.message,'error'); }
    };

    // ===== Render Modules =====
    async function renderModule(mod){
        const c=$el('wsContent');
        try{
            if(mod==='dashboard') c.innerHTML=await renderDashboard();
            else if(mod==='router') c.innerHTML=await renderRouter();
            else if(mod==='rack') c.innerHTML=await renderRack();
            else if(mod==='patch') c.innerHTML=await renderPatch();
            else if(mod==='monitor') c.innerHTML=await renderMonitor();
            else if(mod==='devices') c.innerHTML=await renderDevices();
            else if(mod==='nap') c.innerHTML=await renderNAP();
            else if(mod==='tools') c.innerHTML=await renderTools();
            else if(mod==='security') c.innerHTML=await renderSecurity();
            else if(mod==='tally') c.innerHTML=await renderTally();
            else if(mod==='fabric') c.innerHTML=await renderFabric();
        }catch(e){
            c.innerHTML='<div class="empty-state"><div class="icon">⚠️</div><h3>Error loading module</h3><p>'+escapeHtml(e.message)+'</p></div>';
            console.error(e);
        }
    }

    async function renderDashboard(){
        const results=await Promise.allSettled([
            fetchAPI('/api/v1/stats'),
            fetchAPI('/api/v1/routing'),
            fetchAPI('/api/v1/devices')
        ]);
        const stats=results[0].status==='fulfilled'?results[0].value:{};
        const routers=results[1].status==='fulfilled'?(results[1].value.routers||[]):[];
        const devices=results[2].status==='fulfilled'?(results[2].value.devices||[]):[];
        const rb=stats.runbooks||{}; const np=stats.naps||{}; const reg=stats.registry||{}; const net=stats.networkProtocols||{};
        const cluster=stats.cluster||{};
        const reachable=cluster.reachable===true;
        setSystemStatus(reachable);
        return `
        <div class="stats-grid">
            <div class="stat-card"><div class="label">Cluster</div><div class="value" data-stat="cluster">${reachable?'Online':'Offline'}</div><div class="sub">${escapeHtml(cluster.context||'no context')} · ${escapeHtml(cluster.server||'not configured')}</div></div>
            <div class="stat-card"><div class="label">Runbooks</div><div class="value" data-stat="runbooks">${rb.total||0}</div><div class="sub">Live: ${rb.phases&&rb.phases.Live||0} · Degraded: ${rb.phases&&rb.phases.Degraded||0}</div></div>
            <div class="stat-card"><div class="label">NAP Applications</div><div class="value" data-stat="naps">${np.total||0}</div><div class="sub">Validated: ${np.phases&&np.phases.Validated||0} · Unknown: ${np.phases&&np.phases.Unknown||0}</div></div>
            <div class="stat-card"><div class="label">NAP Registry</div><div class="value" data-stat="registry">${reg.total||0}</div><div class="sub">Approved: ${reg.phases&&reg.phases.Approved||0}</div></div>
            <div class="stat-card"><div class="label">Routers</div><div class="value" data-stat="routers">${routers.length}</div><div class="sub">${routers.map(r=>escapeHtml(r.type||'—')).join(' · ')||'None discovered'}</div></div>
            <div class="stat-card"><div class="label">Devices</div><div class="value" data-stat="devices">${devices.length}</div><div class="sub">${devices.length?'Real device registry':'No placements reported'}</div></div>
        </div>
        <div class="section-header"><div class="section-title"><span class="icon">🌐</span> Network Protocol Health</div></div>
        <div class="stats-grid">
            <div class="stat-card"><div class="label">BGP</div><div class="value">${net.bgp&&net.bgp.state||'—'}</div><div class="sub">Sessions: ${net.bgp&&net.bgp.sessions||'—'}</div></div>
            <div class="stat-card"><div class="label">IGMP</div><div class="value">${net.igmp&&net.igmp.state||'—'}</div><div class="sub">Groups: ${net.igmp&&net.igmp.groups||'—'}</div></div>
            <div class="stat-card"><div class="label">SRT</div><div class="value">${net.srt&&net.srt.state||'—'}</div><div class="sub">RTT: ${net.srt&&net.srt.rttMs||'—'} ms</div></div>
            <div class="stat-card"><div class="label">RIST</div><div class="value">${net.rist&&net.rist.state||'—'}</div><div class="sub">Paths: ${net.rist&&net.rist.paths||'—'}</div></div>
        </div>
        <div class="section-header"><div class="section-title"><span class="icon">📋</span> Quick Actions</div></div>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;">
            <button class="primary" onclick="switchModule('router')"><span class="icon">🔀</span> Router Control</button>
            <button onclick="switchModule('rack')"><span class="icon">🖼️</span> Virtual Rack</button>
            <button onclick="switchModule('patch')"><span class="icon">🔌</span> Patch Bay</button>
            <button onclick="switchModule('devices')"><span class="icon">🎛️</span> Device Control</button>
            <button onclick="switchModule('nap')"><span class="icon">📦</span> NAP & Runbook</button>
            <button onclick="switchModule('tools')"><span class="icon">🛠️</span> Broadcast Tools</button>
        </div>
        `;
    }

    // ===== Router Module =====
    window.__routers=[];
    window.__selectedRouter=null;
    async function renderRouter(){
        let routers=[];
        try{
            const d=await fetchAPI('/api/v1/routing');
            routers=d.routers||[];
        }catch(e){
            showToast('Router load failed: '+e.message,'error');
        }
        window.__routers=routers;
        const selected=routers.find(r=>r.id===window.__selectedRouter)||routers[0]||null;
        if(selected) window.__selectedRouter=selected.id;
        return `
        <div class="router-section">
            <div class="router-sidebar">
                <div style="padding:1rem; font-weight:700; font-size:0.85rem; border-bottom:1px solid var(--line); color:var(--accent);">ROUTERS</div>
                <div style="padding:1rem; overflow-y:auto;">
                    ${routers.map(r=>`
                        <div class="router-card ${selected&&r.id===selected.id?'selected':''}" data-router="${escapeHtml(r.id)}" onclick="selectRouter('${escapeHtml(r.id)}')">
                            <div style="font-weight:700; color:var(--text-primary);">${escapeHtml(r.name||'Router')}</div>
                            <div style="font-size:0.7rem; color:var(--text-muted);">${escapeHtml(r.type||'—')} · <span class="badge ${r.status==='online'?'online':'offline'}">${escapeHtml(r.status||'—')}</span></div>
                            <div style="font-size:0.7rem; color:var(--text-secondary); margin-top:4px;">${r.inputs||0} In × ${r.outputs||0} Out · ${r.crosspoints||0} XPs</div>
                        </div>
                    `).join('')||'<div style="color:var(--text-muted); font-size:0.85rem;">No routers</div>'}
                </div>
            </div>
            <div class="router-main">
                <div class="router-controls">
                    <span id="routerGridLabel" style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">${selected?escapeHtml(selected.name):'No router selected'} — click a crosspoint to take</span>
                    <div style="margin-left:auto; display:flex; gap:6px; align-items:center;">
                        <span class="badge" style="background:var(--router-free);color:var(--text-secondary)">Free</span>
                        <span class="badge" style="background:var(--router-active);color:#0a1218">Active</span>
                        <span class="badge" style="background:var(--router-locked);color:#fff">Locked</span>
                        <span class="badge" style="background:var(--router-protect);color:#0a1218">Protect</span>
                        <button onclick="clearSelectedRoute()" style="margin-left:8px;">Clear selected</button>
                    </div>
                </div>
                <div class="router-grid-wrap" id="routerGrid" style="grid-template-columns:110px repeat(${selected?selected.outputs||8:8},minmax(52px,1fr));">
                    ${selected?renderRouterGrid(selected):'<div class="empty-state">No routers discovered</div>'}
                </div>
            </div>
        </div>
        `;
    }
    function renderRouterGrid(r){
        const ins=r.inputs||8; const outs=r.outputs||8;
        const routeMap={};
        (r.routes||[]).forEach(route=>{ routeMap[route.output]=route; });
        let html='';
        html+='<div class="router-corner">OUT →<br>IN ↓</div>';
        for(let j=1;j<=outs;j++){
            html+='<div class="router-col-label"><span>OUT '+j+'</span></div>';
        }
        for(let i=1;i<=ins;i++){
            html+='<div class="router-row-label">IN '+i+'</div>';
            for(let j=1;j<=outs;j++){
                const route=routeMap[j];
                let state='free'; let label='';
                if(route && route.input===i){
                    state=route.state==='protected'?'protect':route.state==='locked'?'locked':'active';
                    label=String(route.input);
                }
                html+='<div class="router-cell '+state+'" data-in="'+i+'" data-out="'+j+'" onclick="takeRoute(this)" title="IN '+i+' → OUT '+j+'"><span class="xp">'+label+'</span></div>';
            }
        }
        return html;
    }
    window.selectRouter=function(id){
        window.__selectedRouter=id;
        const r=(window.__routers||[]).find(x=>x.id===id);
        if(!r) return;
        document.querySelectorAll('.router-card').forEach(c=>c.classList.toggle('selected',c.dataset.router===id));
        const grid=$el('routerGrid');
        grid.style.gridTemplateColumns='110px repeat('+(r.outputs||8)+',minmax(52px,1fr))';
        grid.innerHTML=renderRouterGrid(r);
        $el('routerGridLabel').textContent=(r.name||id)+' — click a crosspoint to take';
    };
    window.takeRoute=function(cell){
        const routerId=window.__selectedRouter;
        if(!routerId){ showToast('Select a router first','warn'); return; }
        if(cell.classList.contains('locked')||cell.classList.contains('protect')){
            showToast('Destination is locked or protected','warn');
            return;
        }
        const input=parseInt(cell.dataset.in,10);
        const output=parseInt(cell.dataset.out,10);
        fetchAPI('/api/v1/routing/take',{method:'POST',body:JSON.stringify({routerID:routerId,input:input,output:output})})
            .then(()=>{
                showToast('Take: '+routerId+' IN'+input+' → OUT'+output,'success');
                const r=(window.__routers||[]).find(x=>x.id===routerId);
                if(r){
                    r.routes=(r.routes||[]).filter(x=>x.output!==output);
                    r.routes.push({output:output,input:input,state:'active'});
                    selectRouter(routerId);
                }
            })
            .catch(e=>showToast('Take failed: '+e.message,'error'));
    };
    window.clearSelectedRoute=function(){
        const routerId=window.__selectedRouter;
        if(!routerId){ showToast('Select a router first','warn'); return; }
        const output=prompt('Output number to clear:','1');
        if(output===null) return;
        fetchAPI('/api/v1/routing/clear',{method:'POST',body:JSON.stringify({routerID:routerId,output:parseInt(output,10)||1})})
            .then(()=>{
                showToast('Output '+output+' cleared','success');
                const r=(window.__routers||[]).find(x=>x.id===routerId);
                if(r){ r.routes=(r.routes||[]).filter(x=>x.output!==parseInt(output,10)); selectRouter(routerId); }
            })
            .catch(e=>showToast('Clear failed: '+e.message,'error'));
    };

    // ===== Rack Module =====
    async function renderRack(){
        let equip=Object.values(RACK_EQUIP);
        try{
            const d=await fetchAPI('/api/v1/devices');
            // Merge any real devices into rack view as placeholders if desired
        }catch(e){}
        equip.sort((a,b)=>a.slot-b.slot);
        const totalU=42;
        let html='';
        let used=0;
        equip.forEach(eq=>{
            const span=Math.min(eq.u||1,totalU-used);
            if(span<=0) return;
            const height='calc('+span+' * var(--rack-unit-h) + '+(span-1)+' * 4px)';
            html+='<div class="rack-slot occupied" id="rackSlot-'+eq.id+'" onclick="toggleRackEquip(\''+eq.id+'\')">';
            html+='<div class="rack-equip'+(eq.power?'':' powered-off')+'">';
            html+='<div class="eq-name">'+escapeHtml(eq.name)+'</div>';
            html+='<div style="font-size:0.65rem; color:var(--text-muted);">'+escapeHtml(eq.type)+' · '+span+'U · Slot '+eq.slot+'</div>';
            html+='<div class="eq-status"><span class="badge '+(eq.power?'online':'offline')+'">'+(eq.power?escapeHtml(eq.status):'POWER OFF')+'</span></div>';
            html+='</div></div>';
            used+=span;
        });
        for(let u=used;u<totalU;u++){
            html+='<div class="rack-slot" style="height:var(--rack-unit-h);" onclick="addEquipHere('+(u+1)+')">'+(u+1)+'U</div>';
        }
        return `
        <div class="rack-section">
            <div class="rack-canvas">
                <div class="rack-frame">
                    <div class="rack-rail left"></div><div class="rack-rail right"></div>
                    ${html}
                </div>
                <div style="margin-top:2rem; text-align:center; color:var(--text-muted); font-size:0.85rem;">42U equipment rack · click equipment to toggle power</div>
            </div>
        </div>
        `;
    }
    window.toggleRackEquip=function(id){
        const eq=RACK_EQUIP[id];
        if(!eq){ showToast('Unknown rack equipment','error'); return; }
        fetchAPI('/api/v1/rack/toggle',{method:'POST',body:JSON.stringify({equipmentID:id})})
            .then(()=>{
                showToast(eq.name+' power '+(eq.power?'off':'on'),'info');
                renderModule('rack');
            })
            .catch(e=>showToast('Rack toggle failed: '+e.message,'error'));
    };
    window.addEquipHere=function(u){ showToast('Add equipment at '+u+'U','info'); };

        if(!__patchSrc||!__patchDst){ showToast('Select source and destination','warn'); return; }

            .then(()=>{
                showToast('Patch '+__patchSrc+' → '+__patchDst+' created','success');

    window.tallyRoute=function(){
        const router=document.getElementById('tallyRouter').value;
        const source=document.getElementById('tallySource').value;
        const dest=document.getElementById('tallyDest').value;
        if(!router||!source||!dest){ showToast('Fill router, source, destination','warn'); return; }
        fetch(`${API_BASE}/api/v1/infrastructure/tally/route`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({routerID:router,sourceID:source,destinationID:dest})
        }).then(r=>r.ok?showToast('Tally route recorded: '+router+' '+source+' → '+dest,'success'):showToast('Tally route failed','error'))
          .catch(e=>showToast('Tally route error: '+e.message,'error'));
    };
    window.tallyClear=function(){
        const router=document.getElementById('tallyClearRouter').value;
        const dest=document.getElementById('tallyClearDest').value;
        if(!router||!dest){ showToast('Fill router and destination','warn'); return; }
        fetch(`${API_BASE}/api/v1/infrastructure/tally/clear`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({routerID:router,destinationID:dest})
        }).then(r=>r.ok?showToast('Tally cleared: '+router+' '+dest,'success'):showToast('Tally clear failed','error'))
          .catch(e=>showToast('Tally clear error: '+e.message,'error'));
    };
    window.tallyProtect=function(){
        const router=document.getElementById('tallyClearRouter').value;
        const dest=document.getElementById('tallyClearDest').value;
        if(!router||!dest){ showToast('Fill router and destination','warn'); return; }
        fetch(`${API_BASE}/api/v1/infrastructure/tally/protect`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({routerID:router,destinationID:dest})
        }).then(r=>r.ok?showToast('Tally protected: '+router+' '+dest,'success'):showToast('Tally protect failed','error'))
          .catch(e=>showToast('Tally protect error: '+e.message,'error'));
    };

    async function renderFabric(){
        let clusters=[];
        try{
            const d=await fetchAPI('/api/v1/infrastructure/fabric/clusters'); clusters=d.clusters||[];
        }catch(e){ clusters=[]; }
        return `
        <div class="section-header"><div class="section-title"><span class="icon">☁️</span> Fabric & Multi-Cluster</div></div>
        <div class="stats-grid">
            <div class="stat-card"><div class="label">Clusters</div><div class="value">${clusters.length}</div><div class="sub">Registered</div></div>
            <div class="stat-card"><div class="label">Control Plane</div><div class="value">Zeus Kernel</div><div class="sub">Centralized</div></div>
            <div class="stat-card"><div class="label">Data Plane</div><div class="value">NAP Pods</div><div class="sub">Distributed</div></div>
            <div class="stat-card"><div class="label">Mode</div><div class="value">${$el('envSelect').value}</div><div class="sub">On-prem + Cloud</div></div>
        </div>
        <div class="section-header" style="margin-top:1rem"><div class="section-title"><span class="icon">🏗️</span> Registered Clusters</div></div>
        <div class="table-container">
            <table>
                <thead><tr><th>ID</th><th>Name</th><th>Environment</th><th>Region</th><th>Capacity</th><th>Action</th></tr></thead>
                <tbody>
                    ${clusters.map(c=>`
                        <tr><td><code>${escapeHtml(c.id||'—')}</code></td><td>${escapeHtml(c.name||'—')}</td><td><span class="badge ${c.environment==='cloud'?'online':c.environment==='hybrid'?'degraded':'pending'}">${escapeHtml(c.environment||'—')}</span></td><td>${escapeHtml(c.region||'—')}</td><td>${c.capacity||'—'}</td><td><button onclick="fabricScale('${escapeHtml(c.id)}')">Scale</button></td></tr>
                    `).join('')||'<tr><td colspan="6" class="empty-state">No clusters</td></tr>'}
                </tbody>
            </table>
        </div>
        <div class="section-header" style="margin-top:2rem"><div class="section-title"><span class="icon">⚖️</span> Dynamic Scale On Demand</div></div>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;">
            <div style="display:flex;flex-direction:column;gap:0.5rem;">
                <div style="font-size:0.75rem;color:var(--text-muted);">Scale NAP</div>
                <input type="text" id="scaleNap" placeholder="NAP/deployment name" style="padding:6px;border-radius:4px;border:1px solid var(--line);background:var(--bg-dark);color:var(--text-primary);font-size:0.8rem;">
                <input type="number" id="scaleReplicas" placeholder="replicas" value="1" style="padding:6px;border-radius:4px;border:1px solid var(--line);background:var(--bg-dark);color:var(--text-primary);font-size:0.8rem;">
                <button class="primary" onclick="scaleNap()">Scale</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:0.5rem;">
                <div style="font-size:0.75rem;color:var(--text-muted);">Burst to Cloud</div>
                <input type="text" id="burstNap" placeholder="NAP name" style="padding:6px;border-radius:4px;border:1px solid var(--line);background:var(--bg-dark);color:var(--text-primary);font-size:0.8rem;">
                <input type="number" id="burstOnPrem" placeholder="on-prem replicas" value="0" style="padding:6px;border-radius:4px;border:1px solid var(--line);background:var(--bg-dark);color:var(--text-primary);font-size:0.8rem;">
                <input type="number" id="burstCloud" placeholder="cloud replicas" value="2" style="padding:6px;border-radius:4px;border:1px solid var(--line);background:var(--bg-dark);color:var(--text-primary);font-size:0.8rem;">
                <button style="background:transparent;border-color:var(--accent-border);color:var(--accent);" onclick="burstNap()">Burst</button>
            </div>
        </div>
        <div style="margin-top:1rem; color:var(--text-muted); font-size:0.8rem;">Control plane (Zeus Kernel) is separated from data plane (NAP pods). Scale dynamically via HPA + cluster autoscaler integration.</div>
        `;
    }
    window.fabricScale=function(clusterID){
        const replicas=prompt('Replicas for cluster '+clusterID+':','1');
        if(replicas===null) return;
        fetch(`${API_BASE}/api/v1/infrastructure/fabric/scale`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({clusterID:clusterID,namespace:'default',name:'zeus-kernel',replicas:parseInt(replicas)||1})
        }).then(r=>r.ok?showToast('Cluster scaled','success'):showToast('Scale failed','error'))
          .catch(e=>showToast('Scale error: '+e.message,'error'));
    };
    window.scaleNap=function(){
        const name=document.getElementById('scaleNap').value;
        const replicas=parseInt(document.getElementById('scaleReplicas').value)||1;
        if(!name){ showToast('Enter NAP name','warn'); return; }
        fetch(`${API_BASE}/api/v1/infrastructure/fabric/scale`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({clusterID:'on-prem',namespace:'default',name:name,replicas:replicas})
        }).then(r=>r.ok?showToast('NAP '+name+' scaled to '+replicas,'success'):showToast('Scale failed','error'))
          .catch(e=>showToast('Scale error: '+e.message,'error'));
    };
    window.burstNap=function(){
        const name=document.getElementById('burstNap').value;
        const onPrem=parseInt(document.getElementById('burstOnPrem').value)||0;
        const cloud=parseInt(document.getElementById('burstCloud').value)||2;
        if(!name){ showToast('Enter NAP name','warn'); return; }
        fetch(`${API_BASE}/api/v1/infrastructure/fabric/burst`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({namespace:'default',napName:name,onPremReplicas:onPrem,cloudReplicas:cloud})
        }).then(r=>r.ok?showToast('Burst '+name+' to cloud ('+cloud+' replicas)','success'):showToast('Burst failed','error'))
          .catch(e=>showToast('Burst error: '+e.message,'error'));
    };

    async function renderTools(){
        let tools=[];
        try{ const d=await fetchAPI('/api/v1/broadcast-tools'); tools=d.tools||[]; }catch(e){ tools=[{id:'t1',name:'NAP Conformance Check',category:'conformance',status:'idle',lastRun:'—',result:'—'},{id:'t2',name:'Runbook Validator',category:'validation',status:'idle',lastRun:'—',result:'—'},{id:'t3',name:'NMOS IS-04 Discovery',category:'discovery',status:'idle',lastRun:'—',result:'—'}]; }
        return `
        <div class="section-header"><div class="section-title"><span class="icon">🛠️</span> Broadcast Tools</div></div>
        <div class="table-container">
            <table>
                <thead><tr><th>Tool</th><th>Category</th><th>Status</th><th>Last Run</th><th>Result</th><th>Action</th></tr></thead>
                <tbody>
                    ${tools.map(t=>`<tr><td><code>${escapeHtml(t.name||'—')}</code></td><td>${escapeHtml(t.category||'—')}</td><td><span class="badge ${(t.status||'idle').toLowerCase()}">${escapeHtml(t.status||'—')}</span></td><td>${escapeHtml(t.lastRun||'—')}</td><td>${escapeHtml(t.result||'—')}</td><td><button onclick="runTool('${escapeHtml(t.id)}')">Run</button></td></tr>`).join('')}
                </tbody>
            </table>
        </div>
        <div style="margin-top:1.5rem; color:var(--text-muted); font-size:0.8rem;">Tools execute against the selected environment (${$el('envSelect').value}). Results stream via SSE.</div>
        `;
    }
    window.runTool=function(id){ showToast('Tool '+id+' queued','info'); };

    // ===== Environment Switcher =====
    $el('envSelect').addEventListener('change',function(){
        showToast('Environment switched to '+this.value,'info');
    });

    // ===== SSE Connection with reconnection =====
    function connectSSE(){
        if(sse){ try{sse.close();}catch(e){} sse=null; }
        if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }

        var sseTimeout = setTimeout(function(){
            $el('sseDot').className='sse-dot warn';
            $el('sseText').textContent='Polling (SSE unavailable)';
            if(!pollTimer){
                pollTimer=setInterval(()=>{ renderModule(currentModule); },15000);
                if(!sseToastShown){ showToast('SSE unavailable - polling fallback','warn'); sseToastShown=true; }
            }
        }, 5000);

        sse=new EventSource(`${API_BASE}/api/v1/events`);
        sse.onopen=()=>{
            clearTimeout(sseTimeout);
            reconnectDelay=1000;
            $el('sseDot').className='sse-dot live';
            $el('sseText').textContent='Live';
            if(!sseToastShown){ showToast('Real-time connection established','success'); sseToastShown=true; }
        };
        sse.onmessage=(ev)=>{
            try{
                const d=JSON.parse(ev.data);
                if(d.event==='stats'){
                    window.__lastStats=d;
                    updateDashboardLive(d);
                }
            }catch(e){}
        };
        sse.onerror=()=>{
            clearTimeout(sseTimeout);
            $el('sseDot').className='sse-dot fail';
            $el('sseText').textContent='Reconnecting…';
            try{sse.close();}catch(e){} sse=null;
            if(!pollTimer){
                pollTimer=setInterval(()=>{ renderModule(currentModule); },15000);
            }
            setTimeout(()=>{ connectSSE(); },reconnectDelay);
            reconnectDelay=Math.min(reconnectDelay*2,30000);
        };
    }
    function updateDashboardLive(d){
        const set=(key,value)=>{ document.querySelectorAll('[data-stat="'+key+'"]').forEach(el=>{ el.textContent=value; }); };
        if(d.runbooks){ set('runbooks',d.runbooks.total||0); }
        if(d.naps){ set('naps',d.naps.total||0); }
        if(d.registry){ set('registry',d.registry.total||0); }
        set('cluster',d.reachable===true?'Online':'Offline');
        setSystemStatus(d.reachable===true);
        const alarms=$el('alarmCount');
        if(alarms){
            const degraded=(d.runbooks&&d.runbooks.phases&&d.runbooks.phases.Degraded||0)+(d.naps&&d.naps.phases&&d.naps.phases.Rejected||0);
            alarms.textContent=String(degraded);
        }
    }

    // ===== Init =====
    document.addEventListener('DOMContentLoaded',()=>{
        renderModule('dashboard');
        connectSSE();
    });
</script>
</body>
</html>
