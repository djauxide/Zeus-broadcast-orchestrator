{{- if .Values.mcp.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeus-mcp-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app: zeus-mcp-registry
spec:
  replicas: {{ .Values.mcp.registry.replicaCount }}
  selector:
    matchLabels:
      app: zeus-mcp-registry
  template:
    metadata:
      labels:
        app: zeus-mcp-registry
    spec:
      serviceAccountName: zeus-kernel
      containers:
        - name: mcp-registry
          image: "{{ .Values.mcp.registry.image.repository }}:{{ .Values.mcp.registry.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.registry.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --nmos-registry-url={{ .Values.mcp.registry.nmosRegistryURL }}
          resources:
{{ toYaml .Values.mcp.registry.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      {{- with .Values.mcp.registry.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
