{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zeus-kernel
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
    app: zeus-kernel
spec:
  selector:
    matchLabels:
      app: zeus-kernel
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
      honorLabels: true
{{- end }}
