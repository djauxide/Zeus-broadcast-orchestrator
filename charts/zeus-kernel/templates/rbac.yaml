
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeus-kernel
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zeus-kernel
rules:
  - apiGroups: ["core.zeus.broadcast"]
    resources: ["zeusrunbooks", "zeusapplicationpackages", "napregistries", "runbooktemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["core.zeus.broadcast"]
    resources:
      - zeusrunbooks/status
      - zeusapplicationpackages/status
      - napregistries/status
      - runbooktemplates/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["mxl.qvest-digital.com"]
    resources: ["mxlreceivers", "mxlflows", "mxldomains", "mxlflowmirrors", "mxlnodecapabilities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    # read-only; the reconciler binds MxlReceiver.podRef to the live pod of
    # the app label, so it must list pods cluster-wide (runbooks can
    # reference NAPs in any namespace)
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # read-only; controller-runtime's cache lists secrets cluster-wide to
    # resolve passphraseSecretRef for runbooks in any namespace
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # leader election emits an event when this replica becomes leader; without
    # this the API server rejects it with "events is forbidden"
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeus-kernel-leader-election
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeus-kernel-leader-election
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zeus-kernel-leader-election
subjects:
  - kind: ServiceAccount
    name: zeus-kernel
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zeus-kernel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zeus-kernel
subjects:
  - kind: ServiceAccount
    name: zeus-kernel
    namespace: {{ .Release.Namespace }}
