{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeus-kernel-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app: zeus-kernel
    grafana_dashboard: "1"
data:
  zeus.json: |-
{{ .Files.Get "files/zeus-dashboard.json" | indent 4 }}
{{- end }}
