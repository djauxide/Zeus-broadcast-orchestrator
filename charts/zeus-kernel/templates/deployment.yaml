
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeus-kernel
  namespace: {{ .Release.Namespace }}
  labels:
    app: zeus-kernel
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: zeus-kernel
  template:
    metadata:
      labels:
        app: zeus-kernel
    spec:
      serviceAccountName: zeus-kernel
      topologySpreadConstraints:
{{ toYaml .Values.topologySpreadConstraints | indent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          resources:
{{ toYaml .Values.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            # The controller runs with a 500m CPU limit; on a busy single-node
            # dev cluster a 1s probe timeout causes restart storms while the
            # process is merely descheduled. Keep the probe meaningful but
            # tolerant of scheduler latency.
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - { name: webhook, containerPort: 9443 }
            - { name: metrics, containerPort: 8080 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: webhook-tls, mountPath: /tmp/k8s-webhook-server/serving-certs, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: webhook-tls
          secret:
            secretName: zeus-kernel-webhook-tls
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
