{{- if .Values.mcp.fabric.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeus-mcp-fabric
  namespace: {{ .Release.Namespace }}
  labels:
    app: zeus-mcp-fabric
spec:
  replicas: {{ .Values.mcp.fabric.replicaCount }}
  selector:
    matchLabels:
      app: zeus-mcp-fabric
  template:
    metadata:
      labels:
        app: zeus-mcp-fabric
    spec:
      serviceAccountName: zeus-kernel
      containers:
        - name: mcp-fabric
          image: "{{ .Values.mcp.fabric.image.repository }}:{{ .Values.mcp.fabric.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.fabric.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          resources:
{{ toYaml .Values.mcp.fabric.resources | indent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      {{- with .Values.mcp.fabric.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
