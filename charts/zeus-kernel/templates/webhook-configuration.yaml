{{- if .Values.webhook.enabled }}
{{- $svc := printf "zeus-kernel-webhook.%s.svc" .Release.Namespace }}
{{- $altNames := list $svc (printf "zeus-kernel-webhook.%s" .Release.Namespace) (printf "zeus-kernel-webhook.%s.svc.cluster.local" .Release.Namespace) }}
{{- $ca := genCA "zeus-kernel-webhook-ca" 3650 }}
{{- $cert := genSignedCert $svc (list "127.0.0.1") $altNames 3650 $ca }}
{{- if not .Values.webhook.certManager.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: zeus-kernel-webhook-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app: zeus-kernel
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
---
{{- else }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zeus-kernel-webhook-selfsigned
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zeus-kernel-webhook-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: zeus-kernel-webhook-tls
  duration: 8760h
  renewBefore: 720h
  commonName: {{ $svc }}
  dnsNames:
    - {{ $svc }}
    - zeus-kernel-webhook.{{ .Release.Namespace }}
    - zeus-kernel-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: zeus-kernel-webhook-selfsigned
    kind: Issuer
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: zeus-kernel-validating-webhook-configuration
  labels:
    app: zeus-kernel
{{- if .Values.webhook.certManager.enabled }}
  annotations:
    # cert-manager's cainjector fills in caBundle from the serving cert.
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/zeus-kernel-webhook-tls
{{- end }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: zeus-kernel-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-core-zeus-broadcast-v1alpha1-zeusrunbook
        port: 443
{{- if not .Values.webhook.certManager.enabled }}
      caBundle: {{ $ca.Cert | b64enc | quote }}
{{- end }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    sideEffects: None
    name: vzeusrunbook.kb.io
    rules:
      - apiGroups:
          - core.zeus.broadcast
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - zeusrunbooks
{{- end }}
