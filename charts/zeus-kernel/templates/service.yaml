apiVersion: v1
kind: Service
metadata:
  name: zeus-kernel-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app: zeus-kernel
spec:
  selector:
    app: zeus-kernel
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
    - name: metrics
      port: 8080
      targetPort: 8080
