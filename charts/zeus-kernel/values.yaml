
replicaCount: 2

image:
  repository: ghcr.io/zeus-broadcast/zeus-kernel
  tag: "0.1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: zeus-kernel

nmos:
  registryURL: ""
  authz:
    enabled: false
    tokenURL: ""
    clientID: ""
    clientSecretRef:
      name: ""
      key: ""

mxl:
  apiGroup: "mxl.qvest-digital.com"
  defaultProvider: "tcp"

leaderElection:
  enabled: true

# Admission webhook. Self-signed certificates are generated by Helm when
# certManager.enabled=false (suitable for local/single-cluster installs).
# In production set certManager.enabled=true and install cert-manager first;
# the chart then creates an Issuer + Certificate and lets cainjector manage
# the caBundle.
webhook:
  enabled: true
  failurePolicy: Fail
  certManager:
    enabled: false

# The provider-validation DaemonSet requires a separately built image and is
# only meaningful for RDMA providers. MVP (tcp) leaves it disabled; enable
# explicitly for RDMA rollouts.
providerValidate:
  enabled: false

# Monitoring configuration (Phase 2 Week 10)
monitoring:
  enabled: true
  scrapeInterval: "15s"
  grafana:
    enabled: true
    dashboardPath: "dashboards/zeus.json"
  alerting:
    enabled: true
    rulesPath: "alerts/zeus.yaml"
  tracing:
    enabled: false
    endpoint: ""
    serviceName: "zeus-kernel"

# MCP server configuration (Phase 2 Week 12)
# MCP servers are separate Deployments that expose Zeus functionality
# as MCP tools for agent/client consumption. They do not replace the
# kernel; they are client interfaces that talk to the K8s API.
# All MCP servers are disabled by default; enable individually as needed.
mcp:
  registry:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/zeus-broadcast/zeus-mcp-registry
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    nmosRegistryURL: ""
  fabric:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/zeus-broadcast/zeus-mcp-fabric
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  runbook:
    enabled: false
    replicaCount: 1
    image:
      repository: ghcr.io/zeus-broadcast/zeus-mcp-runbook
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Cross-site scheduler probe (Phase 2 Week 12)
# Probes network latency between sites for multi-site placement cost model.
schedulerProbe:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/zeus-broadcast/zeus-scheduler-probe
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sites: ""
  probeInterval: "30s"
