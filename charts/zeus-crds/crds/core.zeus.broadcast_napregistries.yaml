apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: napregistries.core.zeus.broadcast
spec:
  group: core.zeus.broadcast
  names:
    kind: NAPRegistry
    listKind: NAPRegistryList
    plural: napregistries
    singular: napregistry
    shortNames:
      - napreg
    categories:
      - all
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                napName:
                  type: string
                napVersion:
                  type: string
                napImage:
                  type: string
                napImageSignature:
                  type: string
                napType:
                  type: string
                napDescription:
                  type: string
                conformanceResult:
                  type: string
                conformanceReport:
                  type: string
                submitter:
                  type: string
                submitterContact:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                approvedAt:
                  type: string
                rejectedAt:
                  type: string
                rejectionReason:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
