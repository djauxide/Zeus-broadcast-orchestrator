
apiVersion: core.zeus.broadcast/v1alpha1
kind: ZeusRunbook
metadata:
  name: mvp-single-path
  namespace: default
spec:
  eventClass: mvp-proof
  naps:
    - name: vision-mixer-1
      nap: vision-mixer-1
  ingress:
    contribution:
      redundancy: none
      mergeMode: switchover
      paths:
        - name: primary
          transport: srt
          priority: 1
          srt:
            mode: caller
            remoteHost: 203.0.113.10
            remotePort: 9000
            latencyMs: 120
            pbKeyLen: 32
            passphraseSecretRef:
              name: srt-mvp-pass
              key: passphrase
