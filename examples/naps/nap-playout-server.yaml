apiVersion: core.zeus.broadcast/v1alpha1
kind: ZeusApplicationPackage
metadata:
  name: playout-server-1
  namespace: default
spec:
  image: ghcr.io/zeus-broadcast/playout-server:3.0.0
  imageSignature: "cosign:sha256:yza567bcd890"
  crm:
    cpu: "600m"
    memory: "768Mi"
    mediaIO:
      mxlReader: true
      mxlWriter: true
      domainRef: "domain-a"
      formats: ["video/v210"]
  nmos:
    is04: true
    is05: true
    is10: false
    transport: urn:x-nmos:transport:mxl
  healthPath: /healthz
