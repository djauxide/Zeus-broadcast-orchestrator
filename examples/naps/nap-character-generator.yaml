apiVersion: core.zeus.broadcast/v1alpha1
kind: ZeusApplicationPackage
metadata:
  name: character-generator-1
  namespace: default
spec:
  image: ghcr.io/zeus-broadcast/character-generator:3.2.0
  imageSignature: "cosign:sha256:ghi789jkl012"
  crm:
    cpu: "300m"
    memory: "384Mi"
    mediaIO:
      mxlReader: true
      mxlWriter: false
      domainRef: "domain-a"
      formats: ["video/v210"]
  nmos:
    is04: true
    is05: false
    is10: false
    transport: urn:x-nmos:transport:mxl
  healthPath: /healthz
