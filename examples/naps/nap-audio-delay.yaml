apiVersion: core.zeus.broadcast/v1alpha1
kind: ZeusApplicationPackage
metadata:
  name: audio-delay-1
  namespace: default
spec:
  image: ghcr.io/zeus-broadcast/audio-delay:1.3.0
  imageSignature: "cosign:sha256:bcd890efg123"
  crm:
    cpu: "150m"
    memory: "192Mi"
    mediaIO:
      mxlReader: true
      mxlWriter: true
      domainRef: "domain-a"
      formats: ["audio/pcm"]
  nmos:
    is04: true
    is05: false
    is10: false
    transport: urn:x-nmos:transport:mxl
  healthPath: /healthz
