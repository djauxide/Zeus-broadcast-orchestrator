apiVersion: core.zeus.broadcast/v1alpha1
kind: ZeusApplicationPackage
metadata:
  name: vision-mixer-1
  namespace: default
spec:
  image: ghcr.io/zeus-broadcast/vision-mixer:2.1.0
  imageSignature: "cosign:sha256:abc123def456"
  crm:
    cpu: "500m"
    memory: "512Mi"
    mediaIO:
      mxlReader: true
      mxlWriter: true
      domainRef: "domain-a"
      formats: ["video/v210"]
  nmos:
    is04: true
    is05: true
    is10: false
    transport: urn:x-nmos:transport:mxl
  healthPath: /healthz
