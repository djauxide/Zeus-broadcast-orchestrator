apiVersion: core.zeus.broadcast/v1alpha1
kind: ZeusApplicationPackage
metadata:
  name: slow-motion-server-1
  namespace: default
spec:
  image: ghcr.io/zeus-broadcast/slow-motion-server:1.8.0
  imageSignature: "cosign:sha256:jkl012mno345"
  crm:
    cpu: "1000m"
    memory: "2Gi"
    mediaIO:
      mxlReader: true
      mxlWriter: true
      domainRef: "domain-a"
      formats: ["video/v210"]
  nmos:
    is04: true
    is05: true
    is10: false
    transport: urn:x-nmos:transport:mxl
  healthPath: /healthz
