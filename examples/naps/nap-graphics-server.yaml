apiVersion: core.zeus.broadcast/v1alpha1
kind: ZeusApplicationPackage
metadata:
  name: graphics-server-1
  namespace: default
spec:
  image: ghcr.io/zeus-broadcast/graphics-server:1.9.0
  imageSignature: "cosign:sha256:klm789nop012"
  crm:
    cpu: "450m"
    memory: "512Mi"
    mediaIO:
      mxlReader: true
      mxlWriter: true
      domainRef: "domain-a"
      formats: ["video/v210"]
  nmos:
    is04: true
    is05: true
    is10: false
    transport: urn:x-nmos:transport:mxl
  healthPath: /healthz
