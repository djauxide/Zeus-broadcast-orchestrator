apiVersion: core.zeus.broadcast/v1alpha1
kind: ZeusApplicationPackage
metadata:
  name: video-router-1
  namespace: default
spec:
  image: ghcr.io/zeus-broadcast/video-router:2.4.0
  imageSignature: "cosign:sha256:efg123hij456"
  crm:
    cpu: "300m"
    memory: "384Mi"
    mediaIO:
      mxlReader: true
      mxlWriter: true
      domainRef: "domain-a"
      formats: ["video/v210"]
  nmos:
    is04: true
    is05: true
    is10: false
    transport: urn:x-nmos:transport:mxl
  healthPath: /healthz
