---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-core-zeus-broadcast-v1alpha1-zeusrunbook
  failurePolicy: Fail
  name: vzeusrunbook.kb.io
  rules:
  - apiGroups:
    - core.zeus.broadcast
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - zeusrunbooks
  sideEffects: None
