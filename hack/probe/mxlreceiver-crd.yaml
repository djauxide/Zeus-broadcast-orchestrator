apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mxlreceivers.mxl.qvest-digital.com
spec:
  group: mxl.qvest-digital.com
  names:
    kind: MxlReceiver
    plural: mxlreceivers
    singular: mxlreceiver
    shortNames:
      - mxr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - flowID
                - provider
                - podRef
              properties:
                flowID:
                  type: string
                  pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                provider:
                  type: string
                podRef:
                  type: object
                  required:
                    - name
                    - namespace
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
